 function finishDialog(game,players){if(!game||(!game.draw&&game.winner<0))return;const key=String(game.moveCount)+':'+game.winner+':'+game.draw;if(key===lastResult)return;lastResult=key;const title=game.draw?'Hòa!':(game.winner===0?'X':'O')+' chiến thắng!';const detail=game.mode==='infinite'?'Kết quả: X '+game.scoreX+' đường · O '+game.scoreO+' đường.':(players[game.winner]?.name||'Người chơi')+' đã thắng ván Cờ caro.';$('result').textContent=title;$('result-detail').textContent=detail;$('again').textContent='Về phòng chờ';$('overlay').classList.remove('hidden');}
 function renderLines(lines){if(!Array.isArray(lines)||!lines.length)return;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1500 1500');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','win-line');for(const entry of lines){const cells=Array.isArray(entry)?entry:entry.cells;if(!cells?.length)continue;const first=cells[0],last=cells[cells.length-1],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',(first.c+.5)*100);line.setAttribute('y1',(first.r+.5)*100);line.setAttribute('x2',(last.c+.5)*100);line.setAttribute('y2',(last.r+.5)*100);if(entry.player===2)line.style.stroke='#ff9b83';svg.appendChild(line);} $('board').appendChild(svg);}

  renderBoard(state.game,players);status(state.game.winner>=0||state.game.draw?'Ván đấu đã kết thúc. Chủ phòng có thể bắt đầu ván mới.':state.game.myTurn?'Đến lượt bạn.':'Đang chờ đối thủ đánh.');
 }
 if(!room||!token){status('Thiếu mã phòng hoặc mã xác thực. Hãy quay lại sảnh và vào phòng lại.');$('start-online').disabled=true;return;}
 $('copy-invite').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(room);status('Đã sao chép mã phòng. Hãy gửi mã này cho bạn bè để họ nhập tại sảnh.');}catch{window.prompt('Sao chép mã phòng Cờ caro:',room);status('Mã phòng: '+room);}});

}

function render(){const el=$('board');el.innerHTML='';for(let r=0;r<E.SIZE;r++)for(let c=0;c<E.SIZE;c++){const value=board[r][c],button=document.createElement('button');button.className='cell';button.type='button';button.setAttribute('role','gridcell');button.setAttribute('aria-label',value?('Hàng '+(r+1)+', cột '+(c+1)+', quân '+name(value)):('Hàng '+(r+1)+', cột '+(c+1)+', trống'));button.disabled=finished||!!value||(botMode&&turn===2);button.addEventListener('click',()=>play(r,c));if(value){const stone=document.createElement('span');stone.className='stone '+(value===1?'x':'o');stone.textContent=name(value);button.appendChild(stone);}el.appendChild(button);}
 if(infinite)winningLines=linesFor(1).concat(linesFor(2));if(winningLines.length){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1500 1500');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','win-line');for(const cells of winningLines){const first=cells[0],last=cells[cells.length-1],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',(first.c+.5)*100);line.setAttribute('y1',(first.r+.5)*100);line.setAttribute('x2',(last.c+.5)*100);line.setAttribute('y2',(last.r+.5)*100);svg.appendChild(line);}el.appendChild(svg);}
 $('turn').textContent=finished?'Ván đấu kết thúc':(botMode&&turn===2?'🤖 Bot đang suy nghĩ…':'Lượt '+name(turn));$('undo').disabled=!moves.length; if(botMode)$('hint').textContent='Đang chơi với Bot · Độ khó: '+({easy:'Dễ',medium:'Trung bình',hard:'Khó'}[difficulty])+'. Bạn cầm X, Bot cầm O.';
 if(infinite){const x=E.fiveLines(board,1).length,o=E.fiveLines(board,2).length;$('message').textContent=finished?'Bàn cờ đã kín · Kết quả cuối cùng':'Chế độ vô hạn · Chỉ tính điểm khi bàn cờ kín';$('scoreboard').classList.remove('hidden');$('score-x').textContent=x;$('score-o').textContent=o;$('hint').textContent='Mỗi đường gồm 5 quân riêng biệt được tính 1 điểm. Quân đã nằm trong đường gạch không thể dùng lại để ghi điểm; cần 5 quân khác.';}

}
function play(r,c,fromBot=false){if(finished||(botMode&&turn===2&&!fromBot))return;const beforeX=linesFor(1).length,beforeO=linesFor(2).length,result=E.play(board,r,c,turn);if(!result.ok)return;moves.push({board,turn,finished,winningLines});board=result.board;

 else if(result.draw){finished=true;const x=linesFor(1),o=linesFor(2);winningLines=x.concat(o);if(x.length>o.length)show('X chiến thắng!', 'Bàn cờ đã kín. X: '+x.length+' đường · O: '+o.length+' đường.');else if(o.length>x.length)show('O chiến thắng!','Bàn cờ đã kín. O: '+o.length+' đường · X: '+x.length+' đường.');else show('Hòa!','Bàn cờ đã kín và hai bên cùng có '+x.length+' đường 5 quân.');}

function candidateMoves(b){
 const set=new Set(),out=[];let occupied=0;
 for(let r=0;r<E.SIZE;r++)for(let c=0;c<E.SIZE;c++)if(b[r][c]){occupied++;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<E.SIZE&&cc>=0&&cc<E.SIZE&&!b[rr][cc])set.add(rr+','+cc);}}
 if(!occupied)return [[7,7]];
 for(const key of set){const [r,c]=key.split(',').map(Number);out.push([r,c]);}
 return out;
}
function boardValue(b,player){
 const other=3-player,weights=[0,2,16,140,1600,1000000];let total=0;
 for(let r=0;r<E.SIZE;r++)for(let c=0;c<E.SIZE;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
  const er=r+4*dr,ec=c+4*dc;if(er<0||er>=E.SIZE||ec<0||ec>=E.SIZE)continue;
  let own=0,enemy=0;
  for(let k=0;k<5;k++){const v=b[r+k*dr][c+k*dc];if(v===player)own++;else if(v===other)enemy++;}
  if(!enemy&&own)total+=weights[own];else if(!own&&enemy)total-=weights[enemy]*0.94;
 }
 return total;
}
function botMove(){
 if(finished||!botMode||turn!==2)return;
 const candidates=candidateMoves(board);if(!candidates.length)return;
 let ranked=[];
 for(const [r,c] of candidates){const next=board.map(row=>row.slice());next[r][c]=2;const result=E.winnerFrom(next,r,c);let score=result===2?1e9:boardValue(next,2)-boardValue(next,1)*0.96;score+=(7-Math.abs(7-r)+7-Math.abs(7-c))*0.02;ranked.push({r,c,score});}

  const wins=ranked.filter(m=>m.score>=1e9);if(wins.length){const m=wins[0];play(m.r,m.c,true);return;}
  const blocks=[];
  for(const [r,c] of candidates){const test=board.map(row=>row.slice());test[r][c]=1;if(E.winnerFrom(test,r,c)===1)blocks.push({r,c});}
  if(blocks.length){const m=blocks[Math.floor(Math.random()*blocks.length)];play(m.r,m.c,true);return;}
 }
 ranked.sort((a,b)=>b.score-a.score);
 let choice;
 if(difficulty==='easy'){const pool=ranked.slice(0,Math.min(12,ranked.length));choice=pool[Math.floor(Math.random()*pool.length)];}
 else if(difficulty==='medium'){const pool=ranked.slice(0,Math.min(4,ranked.length));choice=pool[Math.floor(Math.random()*pool.length)];}
 else{
  const top=ranked.slice(0,8);let best=-Infinity;
  for(const move of top){const next=board.map(row=>row.slice());next[move.r][move.c]=2;let worst=Infinity;const replies=candidateMoves(next);
   for(const [rr,cc] of replies){const reply=next.map(row=>row.slice());reply[rr][cc]=1;const score=E.winnerFrom(reply,rr,cc)===1?-1e9:boardValue(reply,2)-boardValue(reply,1);if(score<worst)worst=score;}
   const score=replies.length?worst:boardValue(next,2)-boardValue(next,1);if(score>best){best=score;choice=move;}
  }
 }
 if(choice)play(choice.r,choice.c,true);
}

function show(title,detail){$('result').textContent=title;$('result-detail').textContent=detail;$('overlay').classList.remove('hidden');}
function restart(){board=E.empty();turn=1;moves=[];finished=false;winningLines=[];$('overlay').classList.add('hidden');render();}
$('undo').addEventListener('click',()=>{if(!moves.length)return;clearTimeout(botTimer);let previous=moves.pop();if(botMode&&previous.turn===2&&moves.length)previous=moves.pop();board=previous.board;turn=previous.turn;finished=previous.finished;winningLines=previous.winningLines||[];$('overlay').classList.add('hidden');render();});$('restart').addEventListener('click',restart);$('again').addEventListener('click',restart);render();})();
</script></body></html>
