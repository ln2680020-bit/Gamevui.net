<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Cờ caro · Gamevui.net</title><style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,760px)}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back,button{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font-weight:750;cursor:pointer}.back{display:inline-block}.primary{background:var(--accent);color:#241b0b;border:0}h1{font-size:clamp(32px,7vw,48px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.turn{font-size:18px;font-weight:800}.score{color:var(--muted);font-size:13px}.scoreboard{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:13px}.scoreboard b{color:var(--text)}.board-wrap{width:min(100%,650px);margin:0 auto;background:#172235;border:1px solid #ffffff20;border-radius:14px;padding:7px;box-shadow:0 14px 36px #0003;touch-action:manipulation}.board{position:relative;display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));aspect-ratio:1;gap:1px;background:#34445b;isolation:isolate;border:1px solid #34445b;border-radius:7px;overflow:hidden}.cell:before{content:'';position:absolute;inset:0;pointer-events:none;background:#1b293b}.stone{z-index:1;animation:stone-pop .22s cubic-bezier(.2,.8,.2,1)}.cell:disabled{opacity:1}.win-line{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}.win-line line{stroke:#ffca58;stroke-width:7;stroke-linecap:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw-win-line .55s ease-out forwards;filter:drop-shadow(0 0 5px #ffca58)}@keyframes stone-pop{0%{transform:scale(.25);opacity:.25}75%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@keyframes draw-win-line{to{stroke-dashoffset:0}}.cell{border:0;background:transparent;padding:0;position:relative;min-width:0;min-height:0;display:grid;place-items:center}.cell:focus-visible{outline:2px solid #f3b64b;outline-offset:-2px;z-index:2}.stone{width:90%;height:90%;display:grid;place-items:center;font-size:clamp(15px,3.1vw,30px);line-height:1;font-weight:950;letter-spacing:-.08em;animation:stone-pop .22s cubic-bezier(.2,.8,.2,1);text-shadow:0 2px 5px #0004}.stone.x{color:#65c8ff}.stone.o{color:#ff9b83;letter-spacing:0}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.hint{color:var(--muted);font-size:13px;text-align:center;margin:12px 0 0}.overlay{position:fixed;inset:0;background:#050a12d9;display:grid;place-items:center;padding:20px;animation:overlay-in .25s ease-out;z-index:5}.dialog{animation:win-pop .45s cubic-bezier(.16,1,.3,1)}.dialog h2{color:#f3b64b;text-shadow:0 0 18px #f3b64b66}@keyframes overlay-in{from{opacity:0}to{opacity:1}}@keyframes win-pop{0%{transform:scale(.72) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}.overlay.hidden{display:none}.dialog{background:#1b293b;border:1px solid var(--line);border-radius:18px;padding:24px;width:min(100%,360px);text-align:center;box-shadow:0 20px 70px #0009}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted)}@keyframes five-pulse{0%{box-shadow:0 0 0 0 #ffca5866}60%{box-shadow:0 0 0 9px #ffca5800}100%{box-shadow:0 0 0 0 #ffca5800}}.board-wrap.milestone{animation:five-pulse .65s ease-out}@media(max-width:520px){body{padding:12px}.panel{padding:10px}.board-wrap{padding:5px}.top{margin-bottom:12px}.stone{width:92%;height:92%;font-size:clamp(14px,4vw,25px)}}
</style></head><body><main><div class="top"><a class="back" href="/">← Sảnh trò chơi</a><span>2 NGƯỜI · 1 MÁY</span></div><h1>⭕ Cờ caro</h1><p class="sub">Hai người thay phiên đánh X và O trên cùng một thiết bị.</p><section class="panel status"><div><div class="turn" id="turn">Lượt X</div><div class="score" id="message"></div><div class="scoreboard hidden" id="scoreboard"><span>X: <b id="score-x">0</b> đường</span><span>O: <b id="score-o">0</b> đường</span></div></div><div class="controls"><button id="undo">↶ Đi lại</button><button class="primary" id="restart">Ván mới</button></div></section><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Bàn cờ caro 15 nhân 15"></div></div><p class="hint" id="hint"></p></main><div class="overlay hidden" id="overlay"><div class="dialog"><h2 id="result">X chiến thắng!</h2><p id="result-detail">Ván đấu đã kết thúc.</p><button class="primary" id="again">Chơi ván mới</button></div></div><script src="/games/caro-engine.js"></script><script>
(()=>{const E=window.CaroEngine,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('mode')==='infinite'?'infinite':'normal',infinite=mode==='infinite';let board=E.empty(),turn=1,moves=[],finished=false,winningLines=[];
const name=p=>p===1?'X':'O',linesFor=p=>E.fiveLines(board,p);let milestoneTimer=null;
function render(){const el=$('board');el.innerHTML='';for(let r=0;r<E.SIZE;r++)for(let c=0;c<E.SIZE;c++){const value=board[r][c],button=document.createElement('button');button.className='cell';button.type='button';button.setAttribute('role','gridcell');button.setAttribute('aria-label',value?('Hàng '+(r+1)+', cột '+(c+1)+', quân '+name(value)):('Hàng '+(r+1)+', cột '+(c+1)+', trống'));button.disabled=finished||!!value;button.addEventListener('click',()=>play(r,c));if(value){const stone=document.createElement('span');stone.className='stone '+(value===1?'x':'o');stone.textContent=name(value);button.appendChild(stone);}el.appendChild(button);}
 if(infinite)winningLines=linesFor(1).concat(linesFor(2));if(winningLines.length){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1500 1500');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','win-line');for(const cells of winningLines){const first=cells[0],last=cells[cells.length-1],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',(first.c+.5)*100);line.setAttribute('y1',(first.r+.5)*100);line.setAttribute('x2',(last.c+.5)*100);line.setAttribute('y2',(last.r+.5)*100);svg.appendChild(line);}el.appendChild(svg);}
 $('turn').textContent=finished?'Ván đấu kết thúc':'Lượt '+name(turn);$('undo').disabled=!moves.length;
 if(infinite){const x=E.fiveLines(board,1).length,o=E.fiveLines(board,2).length;$('message').textContent=finished?'Bàn cờ đã kín · Kết quả cuối cùng':'Chế độ vô hạn · Chỉ tính điểm khi bàn cờ kín';$('scoreboard').classList.remove('hidden');$('score-x').textContent=x;$('score-o').textContent=o;$('hint').textContent='Mỗi đoạn 5 quân liền nhau theo ngang, dọc hoặc chéo được tính 1 điểm. Các đường ghi điểm được gạch đỏ.';}
 else{$('message').textContent=finished?'Bấm “Ván mới” để chơi lại.':name(turn)+' đang đi · '+moves.length+' lượt đã đánh';$('scoreboard').classList.add('hidden');$('hint').textContent='Bình thường: ai có 5 quân liên tiếp theo hàng ngang, dọc hoặc chéo sẽ thắng ngay.';}
}
function play(r,c){if(finished)return;const beforeX=linesFor(1).length,beforeO=linesFor(2).length,result=E.play(board,r,c,turn);if(!result.ok)return;moves.push({board,turn,finished,winningLines});board=result.board;
 const afterX=linesFor(1).length,afterO=linesFor(2).length,createdFive=afterX>beforeX||afterO>beforeO;
 if(!infinite&&result.winner){finished=true;winningLines=E.fiveLines(board,result.winner).filter(line=>line.some(cell=>cell.r===r&&cell.c===c));show(name(result.winner)+' chiến thắng!','Đã có 5 quân '+name(result.winner)+' liên tiếp.');}
 else if(result.draw){finished=true;const x=linesFor(1),o=linesFor(2);winningLines=x.concat(o);if(x.length>o.length)show('X chiến thắng!', 'Bàn cờ đã kín. X: '+x.length+' đường · O: '+o.length+' đường.');else if(o.length>x.length)show('O chiến thắng!','Bàn cờ đã kín. O: '+o.length+' đường · X: '+x.length+' đường.');else show('Hòa!','Bàn cờ đã kín và hai bên cùng có '+x.length+' đường 5 quân.');}
 else turn=3-turn;
 if(createdFive){const wrap=document.querySelector('.board-wrap');wrap.classList.remove('milestone');void wrap.offsetWidth;wrap.classList.add('milestone');clearTimeout(milestoneTimer);milestoneTimer=setTimeout(()=>wrap.classList.remove('milestone'),700);$('message').textContent=infinite?'Đã tạo thêm đường 5 quân! Ván đấu tiếp tục.':'Đã đủ 5 quân liên tiếp!';}
 render();}
function show(title,detail){$('result').textContent=title;$('result-detail').textContent=detail;$('overlay').classList.remove('hidden');}
function restart(){board=E.empty();turn=1;moves=[];finished=false;winningLines=[];$('overlay').classList.add('hidden');render();}
$('undo').addEventListener('click',()=>{if(!moves.length)return;const previous=moves.pop();board=previous.board;turn=previous.turn;finished=previous.finished;winningLines=previous.winningLines||[];$('overlay').classList.add('hidden');render();});$('restart').addEventListener('click',restart);$('again').addEventListener('click',restart);render();})();
</script></body></html>
