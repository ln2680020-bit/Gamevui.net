<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Cờ caro · Gamevui.net</title><style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,760px)}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back,button{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font-weight:750;cursor:pointer}.back{display:inline-block}.primary{background:var(--accent);color:#241b0b;border:0}h1{font-size:clamp(32px,7vw,48px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.turn{font-size:18px;font-weight:800}.score{color:var(--muted);font-size:13px}.board-wrap{width:min(100%,650px);margin:0 auto;background:#d6b477;border-radius:12px;padding:8px;box-shadow:0 18px 45px #0005;touch-action:manipulation}.board{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;gap:0;background-color:#d6b477;background-image:linear-gradient(#886b3d77 1px,transparent 1px),linear-gradient(90deg,#886b3d77 1px,transparent 1px);background-size:calc(100% / 14) calc(100% / 14);background-position:center}.cell{border:0;background:transparent;padding:0;position:relative;min-width:0;min-height:0;display:grid;place-items:center}.cell:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}.stone{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;font-size:clamp(9px,2vw,17px);font-weight:900;box-shadow:0 2px 4px #0006}.stone.x{background:radial-gradient(circle at 35% 28%,#fff,#dce5f3 60%,#9aa8bc);color:#172033}.stone.o{background:radial-gradient(circle at 35% 28%,#394b68,#101827 70%);color:#fff;border:1px solid #ffffff55}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.hint{color:var(--muted);font-size:13px;text-align:center;margin:12px 0 0}.overlay{position:fixed;inset:0;background:#050a12c9;display:grid;place-items:center;padding:20px}.overlay.hidden{display:none}.dialog{background:#1b293b;border:1px solid var(--line);border-radius:18px;padding:24px;width:min(100%,360px);text-align:center;box-shadow:0 20px 70px #0009}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted)}@media(max-width:520px){body{padding:12px}.panel{padding:10px}.board-wrap{padding:5px}.top{margin-bottom:12px}.stone{width:82%;height:82%}}
</style></head><body><main><div class="top"><a class="back" href="/">← Sảnh trò chơi</a><span>2 NGƯỜI · 1 MÁY</span></div><h1>⭕ Cờ caro</h1><p class="sub">Hai người thay phiên đánh X và O trên cùng một thiết bị.</p><section class="panel status"><div><div class="turn" id="turn">Lượt X</div><div class="score" id="message">X đi trước · Ai có 5 quân liên tiếp sẽ thắng.</div></div><div class="controls"><button id="undo">↶ Đi lại</button><button class="primary" id="restart">Ván mới</button></div></section><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Bàn cờ caro 15 nhân 15"></div></div><p class="hint">Chạm vào một ô trống để đặt quân. Không cần đăng nhập hay tạo phòng.</p></main><div class="overlay hidden" id="overlay"><div class="dialog"><h2 id="result">X chiến thắng!</h2><p id="result-detail">Ván đấu đã kết thúc.</p><button class="primary" id="again">Chơi ván mới</button></div></div><script src="/games/caro-engine.js"></script><script>
(()=>{const E=window.CaroEngine,$=id=>document.getElementById(id);let board=E.empty(),turn=1,moves=[],finished=false;const name=p=>p===1?'X':'O';
function render(){const el=$('board');el.innerHTML='';for(let r=0;r<E.SIZE;r++)for(let c=0;c<E.SIZE;c++){const value=board[r][c],button=document.createElement('button');button.className='cell';button.type='button';button.setAttribute('role','gridcell');button.setAttribute('aria-label',value?('Hàng '+(r+1)+', cột '+(c+1)+', quân '+name(value)):('Hàng '+(r+1)+', cột '+(c+1)+', trống'));button.disabled=finished||!!value;button.addEventListener('click',()=>play(r,c));if(value){const stone=document.createElement('span');stone.className='stone '+(value===1?'x':'o');stone.textContent=name(value);button.appendChild(stone);}el.appendChild(button);} $('turn').textContent=finished?'Ván đấu kết thúc':'Lượt '+name(turn);$('message').textContent=finished?'Bấm “Ván mới” để chơi lại.':name(turn)+' đang đi · '+moves.length+' lượt đã đánh';$('undo').disabled=!moves.length;}
function play(r,c){if(finished)return;const result=E.play(board,r,c,turn);if(!result.ok)return;moves.push({board,turn});board=result.board;if(result.winner){finished=true;show(name(result.winner)+' chiến thắng!','Đã có 5 quân '+name(result.winner)+' liên tiếp.');}else if(result.draw){finished=true;show('Hòa!','Bàn cờ đã kín, không còn ô trống.');}else turn=3-turn;render();}
function show(title,detail){$('result').textContent=title;$('result-detail').textContent=detail;$('overlay').classList.remove('hidden');}
function restart(){board=E.empty();turn=1;moves=[];finished=false;$('overlay').classList.add('hidden');render();}
$('undo').addEventListener('click',()=>{if(!moves.length)return;const previous=moves.pop();board=previous.board;turn=previous.turn;finished=false;$('overlay').classList.add('hidden');render();});$('restart').addEventListener('click',restart);$('again').addEventListener('click',restart);render();})();
</script></body></html>
