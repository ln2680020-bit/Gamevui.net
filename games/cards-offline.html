<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251d"><title>GameVerse · Sâm & UNO Offline</title>
<style>
:root{color-scheme:dark;--bg:#08170f;--panel:#10271b;--line:#ffffff24;--gold:#f2d27c;--muted:#b9cbbd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d4930,#08170f 65%);color:#f5f7ed;font:15px/1.5 system-ui,sans-serif;min-height:100vh}.wrap{width:min(980px,100%);margin:auto;padding:18px}.top,.row,.actions,.players,.hand{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-weight:950;letter-spacing:1px;color:#f6dc91}.panel{background:#10271beF;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0005}h1{font-size:clamp(25px,5vw,38px);margin:12px 0 4px}.muted{color:var(--muted);font-size:13px}button,select{font:inherit;border-radius:11px;border:1px solid #ffffff30;padding:10px 13px;background:#214b32;color:#fff;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#ffffff12}.setup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.setup label{display:grid;gap:5px;color:var(--muted);font-size:12px}.status{padding:10px;border-radius:10px;background:#ffffff0d;color:#ffe8a5}.players{justify-content:center}.player{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#ffffff0b}.player.active{border-color:var(--gold);box-shadow:0 0 0 1px #f2d27c55}.table{min-height:135px;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse,#17613a,#0a2d1c);border:8px solid #60452c;border-radius:28px;padding:18px}.last{font-size:12px;color:#d9e7d7;margin-bottom:9px}.card{width:56px;height:82px;border-radius:10px;background:linear-gradient(145deg,#fff,#e9e8dc);color:#142016;font-weight:950;font-size:19px;display:grid;place-items:center;border:2px solid #ffffff;box-shadow:0 5px 12px #0007;cursor:pointer;user-select:none}.card.red{color:#bd2530}.card.blue{color:#2477bd}.card.green{color:#27834c}.card.yellow{color:#b18a12}.card.wild{background:conic-gradient(#df303b,#e8c632,#2c9e61,#3477d5,#df303b);color:white;text-shadow:0 1px 4px #000}.card.selected{transform:translateY(-12px);outline:3px solid var(--gold)}.hand{justify-content:center;gap:5px;padding:14px 4px;min-height:112px}.hand .card{width:clamp(39px,8vw,57px);height:clamp(60px,12vw,84px);margin-left:-4px}.actions{justify-content:center;margin-top:12px}.actions button{font-weight:800}.history{max-height:140px;overflow:auto;font-size:12px;color:#c7d5c9}.history div{padding:4px;border-bottom:1px solid #ffffff10}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.setup{grid-template-columns:1fr 1fr}.card{width:45px;height:68px}.table{min-height:110px;border-width:5px}.hand{gap:3px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">GAMEVERSE · OFFLINE</div><button class="secondary" onclick="location.href='/'">⌂ Game Hub</button></header>
<section class="panel"><h1>Chơi Sâm & UNO không cần mạng</h1><p class="muted">Ván đấu và Bot chạy trực tiếp trên thiết bị. Không tạo phòng, không đăng nhập, không gửi dữ liệu người chơi lên máy chủ.</p>
<div class="setup"><label>Trò chơi<select id="game"><option value="sam">Sâm</option><option value="uno">UNO</option></select></label><label>Số lượng Bot<select id="bots"><option value="1">1 Bot</option><option value="2">2 Bot</option><option value="3" selected>3 Bot</option><option value="4">4 Bot</option><option value="5">5 Bot</option></select></label><label>Màu UNO khi đánh lá đổi màu<select id="wild-color"><option value="R">Đỏ</option><option value="G">Xanh lá</option><option value="B">Xanh dương</option><option value="Y">Vàng</option></select></label></div>
<div class="actions"><button id="new-game">▶ Bắt đầu ván mới</button><button class="secondary" id="back-hub">Về Game Hub</button></div></section>
<section id="game-panel" class="panel hidden"><div class="players" id="players"></div><div class="status" id="status" aria-live="polite" style="margin:12px 0"></div>
<div class="table"><div><div class="last" id="last"></div><div id="table-cards" class="row" style="justify-content:center"></div><div class="muted" id="table-meta"></div></div></div>
<div class="row" style="justify-content:space-between;margin-top:12px"><b id="hand-title">Bài của bạn</b><span class="muted" id="hand-count"></span></div><div class="hand" id="hand"></div>
<div class="actions" id="actions"></div></section>
<section class="panel"><b>📜 Lịch sử ván</b><div class="history" id="history"><div>Chưa bắt đầu ván.</div></div></section>
</main><script src="/games/cards-offline-engine.js"></script><script>
'use strict';
const E=window.GameVerseCardsEngine,$=s=>document.querySelector(s);let game=null,selected=new Set(),botTimer=null;const requestedGame=new URLSearchParams(location.search).get('game');if(['sam','uno'].includes(requestedGame))$('#game').value=requestedGame;
function cardLabel(c,type){if(type==='sam'){const rank=({11:'J',12:'Q',13:'K',14:'A',15:'2'})[c>>2]||(c>>2);return rank+['♠','♣','♦','♥'][c&3];}const v=({S:'⊘',V:'⇄',D:'+2',W:'ĐỔI',F:'+4'})[c[1]]||c[1];return c[0]==='W'?v:({R:'🔴',G:'🟢',B:'🔵',Y:'🟡'})[c[0]]+' '+v;}
function cardClass(c,type){if(type==='sam')return ((c&3)>1?'red':'');return c[0]==='W'?'wild':({R:'red',G:'green',B:'blue',Y:'yellow'})[c[0]];}
function start(){clearTimeout(botTimer);selected.clear();game=E.createGame($('#game').value,Number($('#bots').value));$('#game-panel').classList.remove('hidden');render();runBots();}
function render(){
 if(!game)return;const snap=E.snapshot(game),humanTurn=game.turn===0&&game.winner<0;
 $('#players').innerHTML=game.seats.map((p,i)=>'<span class="player '+(i===game.turn?'active':'')+'">'+(p.bot?'🤖 ':'👤 ')+p.name+(i===0?' · Bạn':'')+'<br><small>'+game.hands[i].length+' lá</small></span>').join('');
 $('#status').textContent=game.winner>=0?game.message:(humanTurn?'Đến lượt bạn. '+game.message:game.seats[game.turn].name+' đang suy nghĩ… '+game.message);
 $('#last').textContent=game.history.at(-1)||'Bắt đầu ván';
 $('#table-cards').innerHTML=game.type==='sam'?(game.last.length?game.last.map(c=>'<span class="card '+cardClass(c,'sam')+'" style="cursor:default">'+cardLabel(c,'sam')+'</span>').join(''):'<b>♠ BÀN SÂM ♠</b>'):'<span class="card '+cardClass(game.top,'uno')+'" style="cursor:default">'+cardLabel(game.top,'uno')+'</span>';
 $('#table-meta').textContent=game.type==='uno'?'Màu hiện tại: '+({R:'Đỏ',G:'Xanh lá',B:'Xanh dương',Y:'Vàng'})[game.color]+(game.pendingDraw?' · Đang cộng phạt '+game.pendingDraw.amount+' lá':''):'';
 const hand=game.hands[0];$('#hand-count').textContent=hand.length+' lá';$('#hand').innerHTML=hand.map((c,i)=>'<button class="card '+cardClass(c,game.type)+' '+(selected.has(i)?'selected':'')+'" data-card-index="'+i+'" aria-label="'+cardLabel(c,game.type)+'">'+cardLabel(c,game.type)+'</button>').join('');
 const a=[];
 if(game.winner>=0){a.push('<button id="again">↻ Chơi ván mới</button>');}
 else if(humanTurn&&game.type==='sam'){a.push('<button id="play">Đánh '+(selected.size?'('+selected.size+' lá)':'bài')+'</button>');if(game.last.length)a.push('<button class="secondary" id="pass">Bỏ lượt</button>');if(!game.last.length&&game.samCalled<0)a.push('<button class="secondary" id="call">Báo Sâm</button>');}
 else if(humanTurn){if(game.pendingDraw)a.push('<button id="accept">Rút '+game.pendingDraw.amount+' lá phạt</button>');else if(game.drawnCardSeat===0)a.push('<button class="secondary" id="pass-drawn">Bỏ lượt</button>');else a.push('<button class="secondary" id="draw">Bốc 1 lá</button>');a.push('<button id="play">Đánh '+(selected.size?'lá đã chọn':'bài')+'</button>');}
 $('#actions').innerHTML=a.join('');$('#actions').querySelectorAll('button').forEach(b=>b.disabled=(b.id==='play'&&!selected.size));
 $('#history').innerHTML=game.history.slice().reverse().map(x=>'<div>'+x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>').join('');
}
function doPlay(){const cards=[...selected].map(i=>game.hands[0][i]);let ok=false;if(game.type==='sam')ok=E.samPlay(game,0,cards);else if(cards.length===1)ok=E.unoPlay(game,0,cards[0],$('#wild-color').value);if(!ok){$('#status').textContent='Nước đi chưa hợp lệ. Hãy kiểm tra luật hoặc chọn lại bài.';return;}selected.clear();render();runBots();}
function runBots(){clearTimeout(botTimer);if(!game||game.winner>=0||game.turn===0)return;botTimer=setTimeout(()=>{const before=game.turn;E.botTurn(game);if(game.turn===before&&game.winner<0&&!(game.type==='uno'&&game.drawnCardSeat===before)){$('#status').textContent='Bot chưa thể đi tiếp. Hãy bắt đầu ván mới.';render();return;}render();runBots();},550);}
$('#new-game').addEventListener('click',start);$('#back-hub').addEventListener('click',()=>location.href='/');$('#hand').addEventListener('click',e=>{const b=e.target.closest('[data-card-index]');if(!b||!game||game.turn!==0||game.winner>=0)return;const i=Number(b.dataset.cardIndex);selected.has(i)?selected.delete(i):selected.add(i);render();});
$('#actions').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!game)return;let ok=true;if(b.id==='again'){start();return;}if(b.id==='play'){doPlay();return;}if(b.id==='pass')ok=E.samPass(game,0);if(b.id==='call')ok=E.samCall(game,0);if(b.id==='draw')ok=E.unoDraw(game,0);if(b.id==='pass-drawn')ok=E.unoPass(game,0);if(b.id==='accept')ok=E.unoAccept(game,0);if(!ok)$('#status').textContent='Thao tác không hợp lệ trong lượt này.';selected.clear();render();runBots();});
$('#game').addEventListener('change',()=>{$('#bots').querySelectorAll('option').forEach(o=>o.disabled=Number(o.value)>(($('#game').value==='sam')?4:5));if(Number($('#bots').value)>(($('#game').value==='sam')?4:5))$('#bots').value=$('#game').value==='sam'?'3':'3';});
</script></body></html>
