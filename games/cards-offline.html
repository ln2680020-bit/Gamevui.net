</style></head><body><main id="app"><section class="offline-setup"><div class="mode-chip sam-mode">GAMEVERSE OFFLINE</div><h1>Sâm & UNO · Chơi với Bot</h1><p class="muted">Giao diện và hiệu ứng theo phiên bản GameVerse quen thuộc. Ván đấu, bình luận và cảm xúc được xử lý cục bộ trên thiết bị.</p><div class="setup-grid"><label>Trò chơi<select id="offline-game"><option value="sam">Sâm</option><option value="uno">UNO</option></select></label><label>Số lượng Bot<select id="offline-bots"><option value="1">1 Bot</option><option value="2">2 Bot</option><option value="3" selected>3 Bot</option><option value="4">4 Bot</option><option value="5">5 Bot</option></select></label></div><div class="offline-note">🤖 Bạn có thể xem cấu hình, chọn số Bot rồi mới bắt đầu. Không cần tài khoản, Internet hoặc tạo phòng.</div><div class="offline-setup-actions" style="margin-top:16px"><button id="offline-start">▶ Bắt đầu ván</button><button class="secondary" id="offline-home">⌂ Về Game Hub</button></div></section></main>
<script src="/games/cards-offline-engine.js"></script><script>
'use strict';
const E=window.GameVerseCardsEngine,$=s=>document.querySelector(s);
let game=null,selected=new Set(),selectedUno=[],wildCard=null,botTimer=null,chat=[],emotes=[],soundEnabled=localStorage.getItem('samuno:sound')!=='off',reducedEffects=localStorage.getItem('samuno:reduced-effects')==='on',sortMode='rank',error='',lastSnapshot=null;
const params=new URLSearchParams(location.search),requested=params.get('game');
if(['sam','uno'].includes(requested))$('#offline-game').value=requested;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rank(c){return ({11:'J',12:'Q',13:'K',14:'A',15:'2'})[c>>2]||(c>>2);}
function samCard(c,sel){return '<div class="card '+((c&3)>1?'red':'')+(sel?' selected':'')+'" data-card="'+c+'">'+rank(c)+'<small>'+['♠','♣','♦','♥'][c&3]+'</small></div>';}
function unoCard(c,sel){const v=({S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'})[c[1]]||c[1];return '<div class="card '+(c[0]==='W'?'WILD':c[0])+(sel?' selected':'')+'" data-uno="'+c+'">'+v+'</div>';}
function tableCard(c,type){return type==='sam'?samCard(c,false):unoCard(c,false);}
function tone(freq=520,duration=.12){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+duration);o.stop(c.currentTime+duration);o.onended=()=>c.close();}catch{}}
function fx(symbol,label,sub=''){const old=$('#action-fx');old?.remove();const el=document.createElement('div');el.id='action-fx';el.className='action-fx';el.innerHTML='<div class="action-fx-inner"><div class="action-fx-symbol"></div><div class="action-fx-label"></div><div class="action-fx-sub"></div></div>';el.querySelector('.action-fx-symbol').textContent=symbol;el.querySelector('.action-fx-label').textContent=label;el.querySelector('.action-fx-sub').textContent=sub;document.body.appendChild(el);if(!reducedEffects)el.addEventListener('animationend',()=>el.remove(),{once:true});else setTimeout(()=>el.remove(),900);tone(740,.15);}
function ticker(msg){const el=document.createElement('div');el.className='global-ticker';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),4200);}
function floatingEmote(icon,name){const el=document.createElement('div');el.id='floating-emote';el.textContent=icon+' · '+name;el.style.cssText='position:fixed;z-index:1150;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(48px,12vw,88px);font-weight:900;text-shadow:0 8px 18px #000;pointer-events:none;animation:floatEmote 1.8s ease-out both';document.body.appendChild(el);setTimeout(()=>el.remove(),1900);}
function flight(from,to,label,face=true,delay=0){if(reducedEffects)return;setTimeout(()=>{const el=document.createElement('div');el.className='uno-flight'+(face?' face':'');el.textContent=label||'🂠';el.style.left=(from.x-20)+'px';el.style.top=(from.y-30)+'px';document.body.appendChild(el);requestAnimationFrame(()=>{el.style.transform='translate('+(to.x-from.x)+'px,'+(to.y-from.y)+'px) rotate(8deg) scale(.82)';});el.addEventListener('transitionend',()=>el.remove(),{once:true});setTimeout(()=>el.remove(),850);},delay);}
function rect(el){if(!el)return null;const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function animateDeal(){const source=rect($('.felt')),seats=[...document.querySelectorAll('.player-strip .seat')];let n=0;for(let r=0;r<(game.type==='sam'?10:7);r++)for(let i=0;i<game.seats.length;i++){flight(source,rect(seats[i])||source,'🂠',false,n++*42);} }
function render(){
 if(!game)return;const g=E.snapshot(game),sam=game.type==='sam',humanTurn=game.turn===0&&game.winner<0,hand=game.hands[0],names=game.seats.map(x=>x.name);
 const seats=game.seats.map((p,i)=>'<span class="seat '+(i===game.turn?'turn current-turn':'')+' '+(i===game.winner?'winner-seat':'')+'">'+(i===0?'🙂 ':'🤖 ')+escapeHtml(p.name)+' <small>'+game.hands[i].length+' lá</small></span>').join('');
 const sorted=[...hand].sort((a,b)=>sortMode==='rank'?(sam?(a>>2)-(b>>2)||((a&3)-(b&3)):String(a).localeCompare(String(b))):(sam?(a&3)-(b&3)||((a>>2)-(b>>2)):String(a[0]).localeCompare(String(b[0]))));
 const last=game.history.at(-1)||'Bắt đầu ván';
 const table=sam?(game.last.length?game.last.map(c=>tableCard(c,'sam')).join(''):'♠ BÀN CHƠI SÂM ♠'):tableCard(game.top,'uno');
 const action=sam?'<button data-action="play-sam" '+(humanTurn&&selected.size?'':'disabled')+'>Đánh bài '+(selected.size?'('+selected.size+')':'')+'</button><button data-action="pass" '+(humanTurn&&game.last.length?'':'disabled')+'>Bỏ lượt</button><button data-action="call-sam" '+(humanTurn&&!game.last.length&&game.samCalled<0?'':'disabled')+'>Báo Sâm</button>':(game.pendingDraw&&game.pendingDraw.seat===0?'<button data-action="accept">Rút '+game.pendingDraw.amount+' lá phạt</button>':game.drawnCardSeat===0?'<button data-action="pass-drawn">Bỏ lượt</button>':'<button data-action="draw" '+(humanTurn?'':'disabled')+'>Bốc bài</button>')+'<button data-action="play-uno" '+(humanTurn&&selectedUno.length?'':'disabled')+'>Đánh '+(selectedUno.length||'bài')+'</button>'+(humanTurn&&hand.length===2?'<button data-action="uno">🔴 Báo UNO</button>':'');
 const winner=game.winner>=0?'<div class="winner-banner">👑 VÁN ĐẤU KẾT THÚC 👑<small>'+escapeHtml(names[game.winner])+' chiến thắng!</small></div>':'';
 $('#app').innerHTML='<section class="game-screen"><header class="game-topbar"><div class="game-brand"><span class="mode-chip '+(sam?'sam-mode':'uno-mode')+'">'+(sam?'SÂM':'UNO')+'</span><span class="game-room-label">CHẾ ĐỘ OFFLINE · '+game.seats.length+' NGƯỜI</span></div><div class="game-turn-label">'+(game.winner>=0?'VÁN ĐẤU KẾT THÚC':humanTurn?'ĐẾN LƯỢT BẠN':'Lượt: '+escapeHtml(names[game.turn]))+'</div><div class="game-top-actions"><button class="icon-button" data-action="home" title="Về Game Hub">⌂</button><button class="icon-button" data-action="setup" title="Cấu hình ván mới">⚙</button><button class="icon-button" data-action="sound" title="Âm thanh">'+(soundEnabled?'🔊':'🔇')+'</button></div></header><div class="turn-overview"><span>▶ ĐANG ĐÁNH: <b>'+escapeHtml(names[game.turn])+'</b></span></div><div class="row player-strip">'+seats+'</div><div class="game-table-area"><div class="last-player-label">'+escapeHtml(last)+'</div><div class="felt">'+table+(!sam?'<div class="uno-color-label"><span class="color-dot '+game.color+'"></span>'+({R:'Đỏ',G:'Xanh lá',B:'Xanh dương',Y:'Vàng'})[game.color]+'</div>':'')+'</div></div><div class="game-bottom">'+winner+(game.winner<0?'<div class="hand-zone"><div class="hand">'+sorted.map(c=>sam?samCard(c,selected.has(c)):unoCard(c,selectedUno.includes(c))).join('')+'</div></div><div class="action-bar"><div class="primary-actions">'+action+'</div><div class="secondary-actions"><button data-action="sort">↕ Sắp xếp</button><button data-action="hint">💡 Gợi ý</button>'+(wildCard?'<span class="color-picker-label">Chọn màu:</span>'+['R','G','B','Y'].map(c=>'<button class="color-choice '+c+'" data-color="'+c+'">'+({R:'Đỏ',G:'Xanh',B:'Lam',Y:'Vàng'})[c]+'</button>').join(''):'')+'</div></div>':'<button data-action="again">▶ Chơi ván mới</button>')+(error?'<p class="game-error">'+escapeHtml(error)+'</p>':'')+'</div><div class="game-chat-dock"><div class="chat-box"><b>💬 Bình luận (lưu trong ván này)</b><div class="chat-list">'+(chat.map(x=>'<div class="chat-line"><b>'+escapeHtml(x.name)+':</b> '+escapeHtml(x.text)+'</div>').join('')||'<span class="muted">Chưa có bình luận.</span>')+'</div><div class="chat-controls"><input id="offline-chat" maxlength="180" placeholder="Viết bình luận..."><button data-action="chat">Gửi</button></div><div class="muted">Thả cảm xúc</div><div class="emote-row">'+['😀','😂','😍','😮','😢','😎','👏','🔥','🎉','💪','🤔','❤️'].map(x=>'<button class="offline-emote-button" data-emote="'+x+'">'+x+'</button>').join('')+'</div></div></div><details class="game-extras offline-extras"><summary>☰ Thông tin & tiện ích</summary><div class="extras-grid"><section class="extra-card"><b>📜 Lịch sử ván</b><div class="history-list">'+game.history.slice().reverse().map(x=>'<div class="history-item">'+escapeHtml(x)+'</div>').join('')+'</div></section><section class="extra-card"><b>⚙️ Tùy chọn</b><button data-action="effects">'+(reducedEffects?'Hiệu ứng giảm':'Hiệu ứng đầy đủ')+'</button><button data-action="setup">Ván mới / đổi số Bot</button><p class="muted">Mọi dữ liệu chỉ tồn tại trong phiên chơi này.</p></section></div></details></section>';
}
function setup(){clearTimeout(botTimer);game=null;selected.clear();selectedUno=[];wildCard=null;error='';$('#app').innerHTML='<section class="offline-setup"><div class="mode-chip sam-mode">GAMEVERSE OFFLINE</div><h1>Sâm & UNO · Chơi với Bot</h1><p class="muted">Giao diện và hiệu ứng theo phiên bản GameVerse quen thuộc. Ván đấu, bình luận và cảm xúc được xử lý cục bộ trên thiết bị.</p><div class="setup-grid"><label>Trò chơi<select id="offline-game"><option value="sam" '+(params.get('game')!=='uno'?'selected':'')+'>Sâm</option><option value="uno" '+(params.get('game')==='uno'?'selected':'')+'>UNO</option></select></label><label>Số lượng Bot<select id="offline-bots">'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(n===3?'selected':'')+' '+(n>(($('#offline-game')?.value||params.get('game'))==='sam'?4:5)?'disabled':'')+'>'+n+' Bot</option>').join('')+'</select></label></div><div class="offline-note">🤖 Chọn số Bot rồi nhấn bắt đầu. Không cần tài khoản, Internet hoặc tạo phòng.</div><div class="offline-setup-actions" style="margin-top:16px"><button id="offline-start">▶ Bắt đầu ván</button><button class="secondary" id="offline-home">⌂ Về Game Hub</button></div></section>';
 $('#offline-game').addEventListener('change',()=>{const max=$('#offline-game').value==='sam'?4:5;[...$('#offline-bots').options].forEach(o=>o.disabled=Number(o.value)>max);if(Number($('#offline-bots').value)>max)$('#offline-bots').value='3';});
 $('#offline-start').addEventListener('click',start);$('#offline-home').addEventListener('click',()=>location.href='/');
}
function start(){clearTimeout(botTimer);chat=[];emotes=[];selected.clear();selectedUno=[];wildCard=null;const type=$('#offline-game').value,bots=Math.min(Number($('#offline-bots').value),type==='sam'?4:5);game=E.createGame(type,bots);render();animateDeal();tone(520,.15);runBots();}
function runBots(){clearTimeout(botTimer);if(!game||game.winner>=0||game.turn===0)return;botTimer=setTimeout(()=>{const before=game.turn;E.botTurn(game);if(game.turn===before&&game.winner<0){error='Bot chưa thể tiếp tục. Hãy thử ván mới.';render();return;}const msg=game.history.at(-1)||'';render();if(/đánh/.test(msg))fx('🃏','ĐÁNH BÀI',msg);else if(/rút/.test(msg))tone(360,.15);runBots();},650);}
function play(){if(!game)return;let ok=false;if(game.type==='sam')ok=E.samPlay(game,0,[...selected]);else{if(selectedUno.length===1&&selectedUno[0][0]==='W'&&!wildCard){wildCard=selectedUno[0];render();return;}ok=E.unoPlayCards(game,0,[...selectedUno],$('#offline-wild-color')?.value||'G');}
 if(!ok){error='Nước đi chưa hợp lệ. Hãy kiểm tra luật hoặc chọn lại bài.';render();return;}const played=game.type==='sam'?'BÀI ĐÃ ĐÁNH':'UNO';selected.clear();selectedUno=[];wildCard=null;render();fx('🃏',played,'Đã ghi nhận lượt đánh');runBots();}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-card],[data-uno],[data-color],[data-emote]');if(!b)return;const d=b.dataset;
 if(d.action==='home'){location.href='/';return;}if(d.action==='setup'){setup();return;}if(d.action==='again'){setup();return;}
 if(d.card){if(!game||game.turn!==0||game.winner>=0)return;const c=Number(d.card);selected.has(c)?selected.delete(c):selected.add(c);render();return;}
 if(d.uno){if(!game||game.turn!==0||game.winner>=0)return;const c=d.uno;const n=game.hands[0].filter(x=>x===c).length,chosen=selectedUno.filter(x=>x===c).length;if(chosen<n)selectedUno.push(c);else selectedUno.splice(selectedUno.indexOf(c),1);wildCard=selectedUno.length===1&&selectedUno[0][0]==='W'?selectedUno[0]:null;render();return;}
 if(d.color&&wildCard){const ok=E.unoPlayCards(game,0,[wildCard],d.color);if(ok){selectedUno=[];wildCard=null;render();fx('🌈','ĐỔI MÀU',({R:'ĐỎ',G:'XANH LÁ',B:'XANH DƯƠNG',Y:'VÀNG'})[d.color]);runBots();}return;}
 if(d.emote){emotes.push(d.emote);floatingEmote(d.emote,'Bạn');ticker('✨ Bạn thả cảm xúc '+d.emote);return;}
 if(d.action==='chat'){const input=$('#offline-chat'),value=(input?.value||'').trim();if(value){chat.push({name:'Bạn',text:value});chat=chat.slice(-30);render();}return;}
 if(d.action==='sound'){soundEnabled=!soundEnabled;localStorage.setItem('samuno:sound',soundEnabled?'on':'off');render();return;}
 if(d.action==='effects'){reducedEffects=!reducedEffects;localStorage.setItem('samuno:reduced-effects',reducedEffects?'on':'off');render();return;}
 if(d.action==='sort'){sortMode=sortMode==='rank'?'suit':'rank';render();return;}
 if(d.action==='hint'){if(game.type==='sam'){const m=E.samMove(game.hands[0],game.lastCombo);if(m)selected=new Set(m.cards);else error='Không tìm thấy nước đi phù hợp.';}else{const c=game.hands[0].find(x=>E.unoCanPlay(x,game));if(c)selectedUno=[c];else error='Bạn cần bốc bài.';}render();return;}
 if(d.action==='play-sam'||d.action==='play-uno'){play();return;}
 let ok=true;if(d.action==='pass')ok=E.samPass(game,0);if(d.action==='call-sam'){ok=E.samCall(game,0);if(ok){fx('🌿','BÁO SÂM!','Bạn đã báo Sâm');ticker('🌿 BẠN ĐÃ BÁO SÂM!');}}if(d.action==='draw')ok=E.unoDraw(game,0);if(d.action==='pass-drawn')ok=E.unoPass(game,0);if(d.action==='accept')ok=E.unoAccept(game,0);if(d.action==='uno'){game.unoCalledSeat=0;fx('🔴','UNO!','Bạn đã báo UNO');}
 if(!ok)error='Thao tác không hợp lệ trong lượt này.';else{error='';render();runBots();}
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='offline-chat'){$('[data-action="chat"]')?.click();}});
$('#offline-start')?.addEventListener('click',start);
$('#offline-home')?.addEventListener('click',()=>location.href='/');
$('#offline-game')?.addEventListener('change',()=>{const max=$('#offline-game').value==='sam'?4:5;[...$('#offline-bots').options].forEach(o=>o.disabled=Number(o.value)>max);if(Number($('#offline-bots').value)>max)$('#offline-bots').value='3';});
if(['sam','uno'].includes(requested))$('#offline-game').value=requested;
</script></body></html>
