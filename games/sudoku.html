<!doctype html>
<html lang="vi"><head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%230b102b%22/%3E%3Cpath d=%22M49 17A22 22 0 1 0 50 43H36a10 10 0 1 1 0-20h13%22 fill=%22none%22 stroke=%22%237654ff%22 stroke-width=%227%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M7 43Q28 7 58 20Q34 17 7 43Z%22 fill=%22none%22 stroke=%22%235de3ff%22 stroke-width=%223%22/%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>🧩 Sudoku · GameVerse</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,800px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,button,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.grid{display:grid;gap:7px}.tile{border:1px solid var(--line);background:#26364b;border-radius:8px;min-width:0;display:grid;place-items:center;cursor:pointer;user-select:none}.tile:disabled{cursor:default;opacity:1}.tile.active{outline:3px solid var(--accent);background:#3a506c}.given{color:var(--accent)}.box-complete{animation:boxGlow .9s ease both;background:#155b47!important}.box-burst{animation:boxGlow 1s ease both}.wrong,.pulse-bad{background:#783b42!important;animation:shake .3s}.pulse-good{animation:pop .45s}.color-tile{aspect-ratio:1;border:2px solid #ffffff40;box-shadow:inset 0 0 20px #0002}.glow{filter:brightness(1.8);box-shadow:0 0 24px currentColor,0 0 45px #fff8;transform:scale(.96)}.tile-correct{animation:pop .45s;border:3px solid #fff;box-shadow:0 0 20px #68f0ad}.tile-wrong{animation:shake .3s;border:3px solid #ff6b78;filter:saturate(.5)}.primary,button{touch-action:manipulation}button:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.hidden{display:none!important}.banner{padding:14px;border-radius:14px;background:linear-gradient(110deg,#145b48,#236e83);text-align:center;font-size:20px;font-weight:900;animation:pop .5s}.lose{background:linear-gradient(110deg,#783b42,#58304e)}.scores{display:grid;gap:6px}.score-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:#ffffff09}.score-row.me{outline:1px solid var(--accent)}#board{max-width:520px;margin:14px auto}#word{justify-content:center;gap:6px;min-height:54px;font-size:clamp(18px,4vw,27px);font-weight:900;letter-spacing:2px;overflow-wrap:anywhere}#keys{grid-template-columns:repeat(7,minmax(0,1fr));margin-top:15px}#keys button{padding:8px 0}#numbers{justify-content:center}#board.sudoku{grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}#board.sudoku .tile{border-radius:2px;border:1px solid #ffffff24}#board.sudoku .tile:nth-child(9n + 1),#board.sudoku .tile:nth-child(9n + 4),#board.sudoku .tile:nth-child(9n + 7){border-left:3px solid #f3b64b}#board.sudoku .tile:nth-child(9n + 3),#board.sudoku .tile:nth-child(9n + 6),#board.sudoku .tile:nth-child(9n){border-right:3px solid #f3b64b}#board.sudoku .tile:nth-child(-n + 9),#board.sudoku .tile:nth-child(n + 28):nth-child(-n + 36),#board.sudoku .tile:nth-child(n + 55):nth-child(-n + 63){border-top:3px solid #f3b64b}#board.sudoku .tile:nth-child(n + 19):nth-child(-n + 27),#board.sudoku .tile:nth-child(n + 46):nth-child(-n + 54),#board.sudoku .tile:nth-child(n + 73){border-bottom:3px solid #f3b64b}#board.colors{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lobby-grid input{width:100%;min-width:0}.scoreboard{margin-top:10px}@keyframes boxGlow{0%{box-shadow:0 0 0 #6fffb000;transform:scale(.96)}50%{box-shadow:0 0 22px #62f0b7;transform:scale(1.04)}100%{box-shadow:0 0 0 #6fffb000;transform:scale(1)}}@keyframes pop{50%{transform:scale(1.08);filter:brightness(1.5)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:520px){body{padding:10px}.panel{padding:12px}.lobby-grid{grid-template-columns:1fr}}

/* Responsive touch layout shared by standalone games */
@media(max-width:760px){
 body{padding: max(8px,env(safe-area-inset-top)) 9px calc(10px + env(safe-area-inset-bottom));font-size:14px;overscroll-behavior-y:contain}
 main{width:100%;max-width:100%;min-width:0}
 .top{gap:7px;margin-bottom:10px;flex-wrap:wrap}
 .top h1,h1{font-size:clamp(20px,5vw,27px)}
 .panel{padding:10px;margin-bottom:9px;border-radius:13px}
 button,.back,input,select{min-height:40px;touch-action:manipulation}
 .row,.controls{gap:6px}
 .sub,.muted,.hint{font-size:12px}
 .scoreboard,.scores{gap:5px}
}
@media(max-width:760px) and (orientation:landscape){
 body{min-height:100dvh;padding:4px 10px calc(5px + env(safe-area-inset-bottom))}
 main{max-width:1100px}
 .top{margin-bottom:5px}
 .sub{margin:2px 0 6px}
 .panel{padding:7px;margin-bottom:6px}
 #board{margin:6px auto;max-height:calc(100dvh - 120px)}
 .board{max-height:calc(100dvh - 120px)}
 .controls{margin:5px 0}
 .hint{margin:4px 0}
}
@media(hover:none){button,a,.tile,.cell,.square{-webkit-tap-highlight-color:transparent;touch-action:manipulation}}

</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🧩 Sudoku</h1><p class="sub">Điền số từ 1 đến 9. Mỗi hàng, cột và ô vuông 3×3 phải hợp lệ.</p>
<div class="hidden" aria-hidden="true"><button id="create-room" type="button">Tạo phòng</button><input id="room-code" type="text" autocomplete="off"><button id="join-room" type="button">Tham gia</button></div>
<section class="panel hidden" id="online-lobby"><div class="row" style="justify-content:space-between;align-items:center"><strong>🌐 Phòng trực tuyến</strong><span id="room-label" class="muted">Đang kết nối…</span></div><p id="online-status" class="status" role="status">Đang kết nối vào phòng…</p><div class="row"><button id="start-online" class="primary hidden">Bắt đầu ván</button><span id="players" class="muted"></span></div><div id="scoreboard" class="scores scoreboard"></div></section>
<section class="panel" id="game-panel"><div class="row" style="justify-content:space-between"><span id="mode-label" class="muted">CHẾ ĐỘ CHƠI ĐƠN</span><button id="new" class="primary">Ván mới</button></div>
<div class="row" style="justify-content:space-between;margin-top:8px"><span id="progress" class="muted">0/81 ô</span><span id="sudoku-score" class="muted"></span></div><div id="board" class="grid sudoku"></div><div id="numbers" class="row"></div><div class="row" style="margin-top:8px"><button id="erase">Xóa số</button><button id="check">Kiểm tra</button></div>
<p id="status" class="status" aria-live="polite">Chọn ô trống rồi chọn số.</p><div id="win" class="banner hidden">🏆 CHIẾN THẮNG!</div><div id="lose" class="banner lose hidden">Hết lượt! Hãy thử lại nhé.</div></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s);let online=false,room='',token='',eventSource=null,lastActionStamp='';
function profileToken(){let value=localStorage.getItem('gamevui-profile-token');if(!value){value=crypto.randomUUID();localStorage.setItem('gamevui-profile-token',value);}return value;}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'request_failed');return data;}
function status(text){$('#online-status').textContent=text;}
async function enterRoom(code){$('#online-lobby').classList.remove('hidden');room=String(code).trim().toUpperCase();if(!room)return status('Hãy nhập mã phòng.');const saved=JSON.parse(localStorage.getItem('gamevui-room:'+room)||'{}');const joined=await api('/api/join',{room,game:'sudoku',token:saved.token||'',name:localStorage.getItem('gamevui-name')||'Người chơi',profileToken:profileToken()});token=joined.token;localStorage.setItem('gamevui-room:'+room,JSON.stringify({token}));online=true;$('#room-label').textContent='PHÒNG '+room;$('#mode-label').textContent='THI ĐẤU ONLINE';status('Đã vào phòng '+room+'. Chờ mọi người sẵn sàng.');history.replaceState(null,'','?online=1&room='+encodeURIComponent(room));if(eventSource)eventSource.close();eventSource=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));eventSource.onmessage=e=>{try{renderOnline(JSON.parse(e.data));}catch{}};eventSource.onerror=()=>status('Đang kết nối lại phòng…');}
function renderOnline(state){$('#players').textContent=state.players.map(p=>p.name+(p.connected?'':' (mất kết nối)')).join(' · ');$('#start-online').classList.toggle('hidden',!state.isHost||!!state.game);if(!state.game){$('#status').textContent='Đang chờ chủ phòng bắt đầu. Cần ít nhất 2 người.';return;}const g=state.game;if(g.type!=='sudoku')return;$('#game-panel').classList.remove('hidden');const scoreRows=g.players.map((p,i)=>'<div class="score-row '+(p.id===g.myPlayerId?'me':'')+'"><span>'+(i+1)+'. '+escapeHtml(p.name)+(p.done?' ✓':'')+'</span><b>'+p.score+' điểm</b></div>').join('');$('#scoreboard').innerHTML='<strong>🏁 Bảng xếp hạng</strong>'+scoreRows;if(g.allDone)$('#online-status').textContent='Ván đấu kết thúc · Người thắng: '+(g.players[0]?.name||'—');else status('Đang thi đấu · '+g.players.filter(p=>p.done).length+'/'+g.players.length+' người đã xong.');const stamp=JSON.stringify(g.progress.lastAction||{});const changed=stamp!==lastActionStamp;lastActionStamp=stamp;
applySudoku(g);
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function sendAction(command){try{await api('/api/action',{room,token,command});}catch(e){status('Không thể gửi thao tác: '+e.message);}}
$('#create-room').onclick=async()=>{try{const made=await api('/api/room/create',{game:'sudoku',isPrivate:true});await enterRoom(made.room);}catch(e){status('Không tạo được phòng: '+e.message);}};
$('#join-room').onclick=()=>enterRoom($('#room-code').value).catch(e=>status('Không vào được phòng: '+e.message));
$('#start-online').onclick=async()=>{try{await api('/api/start',{room,token,game:'sudoku'});status('Đề chung đã bắt đầu!');}catch(e){status(e.message==='need_two_players'?'Cần ít nhất 2 người trong phòng.':'Không thể bắt đầu: '+e.message);}};

const puzzles=[['530070000600195000098000060800060003400803001700020006060000280000419005000080079','534678912672195348198342567859761423426853791713924856961537284287419635345286179'],['004000900090020005500000006020004010000080000080100090700000003300010060006000800','264571938193826475578349126927654813451983672683127594715468293348219567926735841']];
let puzzle,solution,values,selected=-1,finished=false,localWrong=0;
function freshLocal(){const p=puzzles[Math.floor(Math.random()*puzzles.length)];puzzle=p[0].split('').map(Number);solution=p[1].split('').map(Number);values=puzzle.slice();selected=-1;finished=false;localWrong=0;renderSudoku();}
function renderSudoku(progress=null){const board=$('#board');board.innerHTML='';const boxes=progress?.completedBoxes||Array.from({length:9},(_,box)=>{const ids=Array.from({length:81},(_,i)=>i).filter(i=>Math.floor(i/27)*3+Math.floor((i%9)/3)===box);return ids.every(i=>values[i]===solution[i]);});values.forEach((v,i)=>{const b=document.createElement('button');b.className='tile';b.style.aspectRatio='1';b.style.padding='0';b.textContent=v||'';if(puzzle[i]){b.disabled=true;b.classList.add('given')}else{if(i===selected)b.classList.add('active');b.addEventListener('click',()=>{selected=i;renderSudoku(progress)});}const box=Math.floor(i/27)*3+Math.floor((i%9)/3);if(boxes[box])b.classList.add('box-complete');if(!online&&v&&v!==solution[i])b.classList.add('wrong');board.append(b);});$('#progress').textContent=values.filter(Boolean).length+'/81 ô';$('#numbers').innerHTML='';for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.disabled=finished;b.addEventListener('click',()=>putSudoku(n));$('#numbers').append(b);}if(finished)$('#status').textContent='🏆 Hoàn thành Sudoku chính xác!';}
function putSudoku(n){if(selected<0||puzzle[selected]||finished)return;if(online){sendAction({type:'fill',index:selected,value:n});return;}values[selected]=n;if(n!==solution[selected])localWrong++;if(values.every((v,i)=>v===solution[i])){finished=true;$('#win').classList.remove('hidden');}renderSudoku();}
function localErase(){if(selected>=0&&!puzzle[selected]&&!finished){values[selected]=0;renderSudoku();}}
function applySudoku(g){values=g.progress.values;puzzle=g.challenge.puzzle;solution=null;finished=g.progress.done;renderSudoku(g.progress);const a=g.progress.lastAction;if(a){const cell=$('#board').children[a.index];if(cell)cell.classList.add(a.correct?'pulse-good':'pulse-bad');if(a.boxCompleted){const box=Math.floor(a.index/27)*3+Math.floor((a.index%9)/3);Array.from($('#board').children).forEach((el,i)=>{if(Math.floor(i/27)*3+Math.floor((i%9)/3)===box)el.classList.add('box-burst');});}if(a.won)$('#win').classList.remove('hidden');}if(g.progress.done)$('#status').textContent='🏆 Bạn đã giải đúng toàn bộ Sudoku!';else $('#status').textContent='Sai: '+g.progress.wrong+' · Điểm: '+g.progress.score;}

$('#new').onclick=()=>{if(online)return;$('#win').classList.add('hidden');freshLocal();};$('#erase').onclick=()=>{if(online||selected<0||puzzle[selected])return;values[selected]=0;renderSudoku();};$('#check').onclick=()=>{if(online)return;const errors=values.reduce((n,v,i)=>n+(v&&v!==solution[i]?1:0),0);$('#status').textContent=errors?'Có '+errors+' ô chưa đúng. Hãy thử lại.':values.every(Boolean)?'🎉 Hoàn thành Sudoku!':'Các số đã điền đều đúng.';};freshLocal();
const params=new URLSearchParams(location.search);if(params.get('online')==='1'&&params.get('room'))enterRoom(params.get('room')).catch(e=>status('Không thể khôi phục phòng: '+e.message));
</script></body></html>
