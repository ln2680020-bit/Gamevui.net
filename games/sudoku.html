<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Sudoku · Gamevui.net</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,button,select,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.grid{display:grid;gap:7px}.tile{border:1px solid var(--line);background:#26364b;border-radius:12px;min-width:0;display:grid;place-items:center;cursor:pointer;user-select:none}.tile:disabled{cursor:default;opacity:1}.tile.active{outline:3px solid var(--accent);background:#3a506c}.tile.good{background:#155b47}.tile.bad{background:#783b42}.primary,.tile,button{touch-action:manipulation}button:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} @media(max-width:480px){body{padding:11px}.panel{padding:12px}}
</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🧩 Sudoku</h1><p class="sub">Điền các số từ 1 đến 9 sao cho mỗi hàng, cột và ô vuông 3×3 không lặp số.</p>
<section class="panel"><div class="row" style="justify-content:space-between"><span class="muted">MỨC ĐỘ: <b>Dễ</b></span><span id="progress" class="muted">0/81 ô</span><button id="new" class="primary">Ván mới</button></div><div id="board" class="grid" style="grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;margin:14px auto;max-width:510px"></div><div class="row" id="numbers" style="justify-content:center"></div><p id="status" class="status" aria-live="polite">Chọn ô trống rồi chọn số muốn điền.</p><div class="row"><button id="erase">Xóa số</button><button id="check">Kiểm tra</button><button id="hint">Gợi ý</button></div></section></main><script>'use strict';const puzzles=[['530070000600195000098000060800060003400803001700020006060000280000419005000080079','534678912672195348198342567859761423426853791713924856961537284287419635345286179'],['004000900090020005500000006020004010000080000080100090700000003300010060006000800','264571938193826475578349126927654813451983672683127594715468293348219567926735841']];let puzzle,solution,values,selected=-1;const board=document.querySelector('#board'),numbers=document.querySelector('#numbers');function start(){const p=puzzles[Math.floor(Math.random()*puzzles.length)];puzzle=p[0].split('').map(Number);solution=p[1].split('').map(Number);values=puzzle.slice();selected=-1;render()}function render(){board.innerHTML='';values.forEach((v,i)=>{const b=document.createElement('button');b.className='tile';b.style.aspectRatio='1';b.style.padding='0';b.style.fontSize='clamp(14px,4vw,23px)';b.style.borderRadius='4px';b.style.borderRight=(i%9===2||i%9===5)?'3px solid #f3b64b':'';b.style.borderBottom=(Math.floor(i/9)===2||Math.floor(i/9)===5)?'3px solid #f3b64b':'';b.textContent=v||'';if(puzzle[i]){b.style.color='#f3b64b';b.disabled=true}else if(i===selected)b.classList.add('active');b.addEventListener('click',()=>{selected=i;render()});board.append(b)});document.querySelector('#progress').textContent=values.filter(Boolean).length+'/81 ô';numbers.innerHTML='';for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>put(n));numbers.append(b)}}function put(n){if(selected<0||puzzle[selected])return;values[selected]=n;render()}document.querySelector('#new').onclick=start;document.querySelector('#erase').onclick=()=>{if(selected>=0&&!puzzle[selected]){values[selected]=0;render()}};document.querySelector('#check').onclick=()=>{const errors=values.reduce((a,v,i)=>a+(v&&v!==solution[i]?1:0),0);document.querySelector('#status').textContent=errors?'Có '+errors+' ô chưa đúng. Hãy thử lại.':values.every(Boolean)?'🎉 Hoàn thành Sudoku!':'Các số đã điền đều đúng.'};document.querySelector('#hint').onclick=()=>{if(selected<0||puzzle[selected]){document.querySelector('#status').textContent='Hãy chọn một ô trống trước.';return}values[selected]=solution[selected];render();document.querySelector('#status').textContent='Đã điền một gợi ý.'};start();</script></body></html>
