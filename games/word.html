<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Đoán từ · Gamevui.net</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,button,select,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.grid{display:grid;gap:7px}.tile{border:1px solid var(--line);background:#26364b;border-radius:12px;min-width:0;display:grid;place-items:center;cursor:pointer;user-select:none}.tile:disabled{cursor:default;opacity:1}.tile.active{outline:3px solid var(--accent);background:#3a506c}.tile.good{background:#155b47}.tile.bad{background:#783b42}.primary,.tile,button{touch-action:manipulation}button:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} @media(max-width:480px){body{padding:11px}.panel{padding:12px}}
</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🔤 Đoán từ</h1><p class="sub">Tìm từ bí mật qua gợi ý. Mỗi lần đoán đúng một chữ cái sẽ giúp bạn tiến gần đáp án.</p>
<section class="panel"><div class="row" style="justify-content:space-between"><span class="muted">VÒNG <b id="round">1</b></span><span class="muted">ĐIỂM <b id="score">0</b></span><button id="new" class="primary">Từ mới</button></div><h2 id="clue" style="text-align:center;margin:22px 0 12px">Gợi ý</h2><div id="word" class="row" style="justify-content:center;gap:7px;min-height:54px;font-size:25px;font-weight:900;letter-spacing:3px"></div><p id="status" class="status" style="text-align:center">Bạn có 6 lượt sai.</p><div id="keys" class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));margin-top:15px"></div></section></main><script>'use strict';const bank=[['hanh tinh','Thiên thể chuyển động quanh một ngôi sao.'],['may tinh','Thiết bị dùng để xử lý thông tin.'],['thu vien','Nơi lưu trữ và cho mượn sách.'],['cau vong','Hiện tượng nhiều màu xuất hiện sau mưa.'],['ban do','Hình thể hiện vị trí và địa hình.'],['trong dong','Nhạc cụ gõ truyền thống của Việt Nam.'],['mat troi','Ngôi sao ở trung tâm hệ hành tinh của chúng ta.']];let answer,clue,guessed,wrong,score=0,round=1,done=false;const word=document.querySelector('#word'),keys=document.querySelector('#keys');function start(){[answer,clue]=bank[Math.floor(Math.random()*bank.length)];guessed=new Set();wrong=0;done=false;document.querySelector('#clue').textContent='💡 '+clue;render()}function render(){word.innerHTML='';answer.replace(/ /g,' ').split('').forEach(c=>{const s=document.createElement('span');s.style.cssText='display:grid;place-items:center;min-width:25px;border-bottom:3px solid #f3b64b;padding:0 3px';s.textContent=c===' '?'·':guessed.has(c)?c.toLocaleUpperCase():'_';word.append(s)});keys.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k=>{const b=document.createElement('button');b.textContent=k;b.disabled=guessed.has(k.toLowerCase())||done;b.style.padding='8px 0';b.addEventListener('click',()=>pick(k.toLowerCase()));keys.append(b)});document.querySelector('#status').textContent='Lượt sai: '+wrong+'/6 · '+(done?'': 'Còn '+(6-wrong)+' lượt');}function pick(c){if(done||guessed.has(c))return;guessed.add(c);if(!answer.includes(c))wrong++;const won=answer.split('').filter(c=>c!==' ').every(c=>guessed.has(c));if(won){done=true;score+=Math.max(10,60-wrong*10);document.querySelector('#score').textContent=score;document.querySelector('#status').textContent='🎉 Chính xác: '+answer.toLocaleUpperCase();round++}else if(wrong>=6){done=true;document.querySelector('#status').textContent='Hết lượt! Đáp án: '+answer.toLocaleUpperCase()}render()}document.querySelector('#new').onclick=()=>{document.querySelector('#round').textContent=round;start()};start();</script></body></html>
