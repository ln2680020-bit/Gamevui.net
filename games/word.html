<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>🔤 Đoán từ · Gamevui.net</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,800px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,button,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.grid{display:grid;gap:7px}.tile{border:1px solid var(--line);background:#26364b;border-radius:8px;min-width:0;display:grid;place-items:center;cursor:pointer;user-select:none}.tile:disabled{cursor:default;opacity:1}.tile.active{outline:3px solid var(--accent);background:#3a506c}.given{color:var(--accent)}.box-complete{animation:boxGlow .9s ease both;background:#155b47!important}.box-burst{animation:boxGlow 1s ease both}.wrong,.pulse-bad{background:#783b42!important;animation:shake .3s}.pulse-good{animation:pop .45s}.color-tile{aspect-ratio:1;border:2px solid #ffffff40;box-shadow:inset 0 0 20px #0002}.glow{filter:brightness(1.8);box-shadow:0 0 24px currentColor,0 0 45px #fff8;transform:scale(.96)}.tile-correct{animation:pop .45s;border:3px solid #fff;box-shadow:0 0 20px #68f0ad}.tile-wrong{animation:shake .3s;border:3px solid #ff6b78;filter:saturate(.5)}.primary,button{touch-action:manipulation}button:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.hidden{display:none!important}.banner{padding:14px;border-radius:14px;background:linear-gradient(110deg,#145b48,#236e83);text-align:center;font-size:20px;font-weight:900;animation:pop .5s}.lose{background:linear-gradient(110deg,#783b42,#58304e)}.scores{display:grid;gap:6px}.score-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:#ffffff09}.score-row.me{outline:1px solid var(--accent)}#board{max-width:520px;margin:14px auto}#word{justify-content:center;gap:6px;min-height:54px;font-size:clamp(18px,4vw,27px);font-weight:900;letter-spacing:2px;overflow-wrap:anywhere}#keys{grid-template-columns:repeat(7,minmax(0,1fr));margin-top:15px}#keys button{padding:8px 0}#numbers{justify-content:center}#board.sudoku{grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}#board.colors{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.timer-danger{color:#ff6b78;font-weight:900;text-shadow:0 0 12px #ff6b7866}.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lobby-grid input{width:100%;min-width:0}.scoreboard{margin-top:10px}@keyframes boxGlow{0%{box-shadow:0 0 0 #6fffb000;transform:scale(.96)}50%{box-shadow:0 0 22px #62f0b7;transform:scale(1.04)}100%{box-shadow:0 0 0 #6fffb000;transform:scale(1)}}@keyframes pop{50%{transform:scale(1.08);filter:brightness(1.5)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:520px){body{padding:10px}.panel{padding:12px}.lobby-grid{grid-template-columns:1fr}}

/* Responsive touch layout shared by standalone games */
@media(max-width:760px){
 body{padding: max(8px,env(safe-area-inset-top)) 9px calc(10px + env(safe-area-inset-bottom));font-size:14px;overscroll-behavior-y:contain}
 main{width:100%;max-width:100%;min-width:0}
 .top{gap:7px;margin-bottom:10px;flex-wrap:wrap}
 .top h1,h1{font-size:clamp(20px,5vw,27px)}
 .panel{padding:10px;margin-bottom:9px;border-radius:13px}
 button,.back,input,select{min-height:40px;touch-action:manipulation}
 .row,.controls{gap:6px}
 .sub,.muted,.hint{font-size:12px}
 .scoreboard,.scores{gap:5px}
}
@media(max-width:760px) and (orientation:landscape){
 body{min-height:100dvh;padding:4px 10px calc(5px + env(safe-area-inset-bottom))}
 main{max-width:1100px}
 .top{margin-bottom:5px}
 .sub{margin:2px 0 6px}
 .panel{padding:7px;margin-bottom:6px}
 #board{margin:6px auto;max-height:calc(100dvh - 120px)}
 .board{max-height:calc(100dvh - 120px)}
 .controls{margin:5px 0}
 .hint{margin:4px 0}
}
@media(hover:none){button,a,.tile,.cell,.square{-webkit-tap-highlight-color:transparent;touch-action:manipulation}}

</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🔤 Đoán từ</h1><p class="sub">Tìm từ bí mật qua gợi ý. Mỗi chữ cái sai sẽ mất một lượt.</p>
<div class="hidden" aria-hidden="true"><button id="create-room" type="button">Tạo phòng</button><input id="room-code" type="text" autocomplete="off"><button id="join-room" type="button">Tham gia</button></div>
<section class="panel hidden" id="online-lobby"><div class="row" style="justify-content:space-between;align-items:center"><strong>🌐 Phòng trực tuyến</strong><span id="room-label" class="muted">Đang kết nối…</span></div><p id="online-status" class="status" role="status">Đang kết nối vào phòng…</p><div class="row"><button id="start-online" class="primary hidden">Bắt đầu ván</button><span id="players" class="muted"></span></div><div id="scoreboard" class="scores scoreboard"></div></section>
<section class="panel" id="game-panel"><div class="row" style="justify-content:space-between"><span id="mode-label" class="muted">CHẾ ĐỘ CHƠI ĐƠN</span><button id="new" class="primary">Từ mới</button></div>
<div class="row" style="justify-content:space-between"><span class="muted">LƯỢT SAI <b id="wrong">0/6</b></span><span class="muted">ĐIỂM <b id="score">0</b></span><span id="timer-label" class="muted">THỜI GIAN <b id="timer">30s</b></span></div><h2 id="clue" style="text-align:center;margin:22px 0 12px">Gợi ý</h2><div id="word" class="row"></div><div id="keys" class="grid"></div>
<p id="status" class="status" aria-live="polite">Bạn có 6 lượt sai.</p><div id="win" class="banner hidden">🏆 CHIẾN THẮNG!</div><div id="lose" class="banner lose hidden">Hết lượt! Hãy thử lại nhé.</div></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s);let online=new URLSearchParams(location.search).get('online')==='1',room='',token='',eventSource=null,lastActionStamp='';
function profileToken(){let value=localStorage.getItem('gamevui-profile-token');if(!value){value=crypto.randomUUID();localStorage.setItem('gamevui-profile-token',value);}return value;}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'request_failed');return data;}
function status(text){$('#online-status').textContent=text;}
async function enterRoom(code){$('#online-lobby').classList.remove('hidden');room=String(code).trim().toUpperCase();if(!room)return status('Hãy nhập mã phòng.');const saved=JSON.parse(localStorage.getItem('gamevui-room:'+room)||'{}');const joined=await api('/api/join',{room,game:'word',token:saved.token||'',name:localStorage.getItem('gamevui-name')||'Người chơi',profileToken:profileToken()});token=joined.token;localStorage.setItem('gamevui-room:'+room,JSON.stringify({token}));online=true;stopWordTimer();$('#timer-label').classList.add('hidden');$('#room-label').textContent='PHÒNG '+room;$('#mode-label').textContent='THI ĐẤU ONLINE';status('Đã vào phòng '+room+'. Chờ mọi người sẵn sàng.');history.replaceState(null,'','?online=1&room='+encodeURIComponent(room));if(eventSource)eventSource.close();eventSource=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));eventSource.onmessage=e=>{try{renderOnline(JSON.parse(e.data));}catch{}};eventSource.onerror=()=>status('Đang kết nối lại phòng…');}
function renderOnline(state){$('#players').textContent=state.players.map(p=>p.name+(p.connected?'':' (mất kết nối)')).join(' · ');$('#start-online').classList.toggle('hidden',!state.isHost||!!state.game);if(!state.game){$('#status').textContent='Đang chờ chủ phòng bắt đầu. Cần ít nhất 2 người.';return;}const g=state.game;if(g.type!=='word')return;$('#game-panel').classList.remove('hidden');const scoreRows=g.players.map((p,i)=>'<div class="score-row '+(p.id===g.myPlayerId?'me':'')+'"><span>'+(i+1)+'. '+escapeHtml(p.name)+(p.done?' ✓':'')+'</span><b>'+p.score+' điểm</b></div>').join('');$('#scoreboard').innerHTML='<strong>🏁 Bảng xếp hạng</strong>'+scoreRows;if(g.allDone)$('#online-status').textContent='Ván đấu kết thúc · Người thắng: '+(g.players[0]?.name||'—');else status('Đang thi đấu · '+g.players.filter(p=>p.done).length+'/'+g.players.length+' người đã xong.');const stamp=JSON.stringify(g.progress.lastAction||{});const changed=stamp!==lastActionStamp;lastActionStamp=stamp;
applyWord(g);
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function sendAction(command){try{await api('/api/action',{room,token,command});}catch(e){status('Không thể gửi thao tác: '+e.message);}}
$('#create-room').onclick=async()=>{try{const made=await api('/api/room/create',{game:'word',isPrivate:true});await enterRoom(made.room);}catch(e){status('Không tạo được phòng: '+e.message);}};
$('#join-room').onclick=()=>enterRoom($('#room-code').value).catch(e=>status('Không vào được phòng: '+e.message));
$('#start-online').onclick=async()=>{try{await api('/api/start',{room,token,game:'word'});status('Đề chung đã bắt đầu!');}catch(e){status(e.message==='need_two_players'?'Cần ít nhất 2 người trong phòng.':'Không thể bắt đầu: '+e.message);}};

const bank=[['hanh tinh','Thiên thể chuyển động quanh một ngôi sao.'],['may tinh','Thiết bị dùng để xử lý thông tin.'],['thu vien','Nơi lưu trữ và cho mượn sách.'],['cau vong','Hiện tượng nhiều màu xuất hiện sau mưa.'],['ban do','Hình thể hiện vị trí và địa hình.'],['trong dong','Nhạc cụ gõ truyền thống của Việt Nam.'],['mat troi','Ngôi sao ở trung tâm hệ hành tinh của chúng ta.'],['dong vat','Những sinh vật có thể di chuyển và cảm nhận.'],['thien van','Ngành khoa học nghiên cứu các thiên thể.'],['bien dao','Vùng nước mặn rộng lớn và các hòn đảo.'],['bao tang','Nơi trưng bày hiện vật lịch sử và nghệ thuật.'],['dien anh','Nghệ thuật kể chuyện bằng hình ảnh chuyển động.'],['am nhac','Nghệ thuật kết hợp giai điệu và âm thanh.'],['the thao','Hoạt động rèn luyện thể chất và thi đấu.'],['robot','Máy móc có thể thực hiện nhiệm vụ tự động.'],['du hanh','Chuyến đi khám phá những nơi xa.'],['sinh hoc','Môn khoa học nghiên cứu sự sống.'],['vat ly','Môn khoa học nghiên cứu vật chất và năng lượng.'],['hoa hoc','Môn khoa học nghiên cứu các chất.'],['la ban','Dụng cụ xác định phương hướng.'],['kinh hien vi','Dụng cụ giúp quan sát vật rất nhỏ.'],['may anh','Thiết bị ghi lại hình ảnh.'],['xe dap','Phương tiện có hai bánh và bàn đạp.'],['may bay','Phương tiện di chuyển trên không trung.'],['hoa sen','Loài hoa thường mọc trên mặt nước.'],['con tho','Động vật có tai dài và thích ăn cà rốt.'],['chim canh cut','Loài chim sống ở vùng băng giá.'],['ca heo','Động vật biển thông minh.'],['ngua van','Loài thú có bộ lông sọc đen trắng.'],['voi','Động vật lớn có chiếc vòi dài.'],['huou cao co','Động vật có chiếc cổ rất dài.'],['mat trang','Vệ tinh tự nhiên của Trái Đất.'],['sao bang','Vệt sáng xuất hiện khi thiên thạch đi vào khí quyển.'],['he mat troi','Mặt Trời và các thiên thể quay quanh nó.'],['nang luong','Khả năng sinh công hoặc tạo ra biến đổi.'],['lap trinh','Công việc viết chỉ dẫn cho máy tính.'],['du lieu','Thông tin được lưu trữ và xử lý.'],['internet','Mạng kết nối các thiết bị trên toàn thế giới.'],['mat khau','Dãy ký tự dùng để bảo vệ tài khoản.'],['ban phim','Thiết bị dùng để nhập chữ vào máy tính.'],['chuot may tinh','Thiết bị điều khiển con trỏ.'],['man hinh','Bộ phận hiển thị hình ảnh.'],['truyen tranh','Câu chuyện được kể bằng các khung hình.'],['cuon sach','Vật chứa nhiều trang giấy có nội dung.'],['but chi','Dụng cụ viết có thể tẩy được.'],['dong ho','Dụng cụ dùng để xem giờ.'],['lich','Bảng hoặc quyển cho biết ngày tháng.'],['may loc nuoc','Thiết bị giúp làm sạch nước.'],['den pin','Dụng cụ chiếu sáng dùng pin.'],['tu lanh','Thiết bị giữ thực phẩm ở nhiệt độ thấp.'],['quat dien','Thiết bị tạo gió làm mát.'],['bong da','Môn thể thao có hai đội tranh tài bằng chân.'],['bong ro','Môn thể thao đưa bóng vào rổ.'],['boi loi','Môn thể thao di chuyển trong nước.'],['co vua','Trò chơi trí tuệ trên bàn 64 ô.'],['co caro','Trò chơi nối các quân thành hàng.'],['xep hinh','Trò chơi ghép các mảnh thành hình hoàn chỉnh.'],['giai ma','Tìm ra ý nghĩa của thông tin bí ẩn.'],['toan hoc','Môn học nghiên cứu con số và phép tính.'],['lich su','Môn học tìm hiểu những sự kiện trong quá khứ.'],['van hoc','Lĩnh vực sáng tác và nghiên cứu tác phẩm chữ nghĩa.'],['ngoai ngu','Ngôn ngữ được học ngoài tiếng mẹ đẻ.'],['hanh phuc','Cảm giác vui vẻ và mãn nguyện.'],['tinh ban','Mối quan hệ thân thiết giữa những người bạn.'],['gia dinh','Những người thân cùng gắn bó với nhau.'],['truong hoc','Nơi học sinh đến học tập.'],['thay giao','Người làm công việc giảng dạy.'],['hoc sinh','Người đang theo học tại trường.'],['thuoc ke','Dụng cụ dùng để đo và kẻ đường thẳng.'],['tam giac','Hình có ba cạnh và ba góc.'],['hinh tron','Hình phẳng có đường biên cách đều tâm.'],['hinh vuong','Hình có bốn cạnh bằng nhau và bốn góc vuông.'],['trai dat','Hành tinh chúng ta đang sinh sống.'],['khong khi','Hỗn hợp khí bao quanh chúng ta.'],['thac nuoc','Dòng nước đổ từ trên cao xuống.'],['ngon nui','Phần đỉnh cao của một ngọn núi.'],['sa mac','Vùng đất khô cằn có rất ít mưa.'],['song ngoi','Dòng nước tự nhiên chảy liên tục.'],['hoa qua','Tên gọi chung của các loại quả.'],['rau cu','Nhóm thực phẩm có nguồn gốc từ thực vật.'],['banh mi','Món ăn thường làm từ bột mì nướng.'],['pho','Món nước nổi tiếng của Việt Nam.'],['com tam','Món ăn quen thuộc làm từ gạo tấm.'],['goi cuon','Món ăn cuốn bánh tráng với rau và nhân.'],['nuoc bien','Nước mặn chiếm phần lớn bề mặt Trái Đất.'],['ca phe','Thức uống được pha từ hạt rang xay.'],['tra xanh','Thức uống được pha từ lá trà.'],['kem','Món tráng miệng lạnh thường có vị ngọt.'],['mat ong','Chất ngọt tự nhiên do ong tạo ra.']];
let answer,clue,guessed=new Set(),wrong=0,score=0,round=1,done=false,lastActionKey='',wordTimer=null,secondsLeft=30,timeoutAdvance=null;
function updateWordTimer(){const el=$('#timer');if(el)el.textContent=secondsLeft+'s';const label=$('#timer-label');if(label)label.classList.toggle('timer-danger',secondsLeft<=10);}
function stopWordTimer(){if(wordTimer){clearInterval(wordTimer);wordTimer=null;}}
function startWord(){stopWordTimer();if(timeoutAdvance){clearTimeout(timeoutAdvance);timeoutAdvance=null;}[answer,clue]=bank[Math.floor(Math.random()*bank.length)];guessed=new Set();wrong=0;done=false;secondsLeft=30;$('#win').classList.add('hidden');$('#lose').classList.add('hidden');$('#timer-label').classList.toggle('hidden',online);updateWordTimer();renderWord();if(!online){wordTimer=setInterval(()=>{if(done||online){stopWordTimer();return;}secondsLeft--;updateWordTimer();if(secondsLeft<=0){stopWordTimer();done=true;score=0;$('#score').textContent='0';$('#lose').textContent='⏰ Hết 30 giây! Bạn thua · Điểm đã về 0.';$('#lose').classList.remove('hidden');renderWord();$('#status').textContent='Hết thời gian! Câu hỏi mới sẽ bắt đầu ngay.';timeoutAdvance=setTimeout(()=>{timeoutAdvance=null;startWord();},1400);}},1000);}}
function renderWord(progress=null,challenge=null){const shown=progress?.display||answer.split('').map(c=>c===' '?' ':guessed.has(c)?c:'_').join('');$('#word').textContent=shown.toUpperCase().split('').join(' ');$('#clue').textContent='💡 '+(challenge?.clue||clue);$('#keys').innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k=>{const b=document.createElement('button');b.textContent=k;const used=progress?progress.guesses.includes(k.toLowerCase()):guessed.has(k.toLowerCase());b.disabled=used||done;b.addEventListener('click',()=>pickWord(k.toLowerCase()));$('#keys').append(b);});$('#status').textContent='Lượt sai: '+(progress?.wrong??wrong)+'/6 · Điểm: '+(progress?.score??score);if(progress?.lastAction){const a=progress.lastAction;if(a.won)$('#win').classList.remove('hidden');if(a.lost)$('#lose').classList.remove('hidden');if(a.correct)$('#word').classList.add('pulse-good');else $('#word').classList.add('pulse-bad');}}
function pickWord(letter){if(done)return;if(online){sendAction({type:'guess',letter});return;}if(guessed.has(letter))return;guessed.add(letter);if(!answer.includes(letter))wrong++;const won=[...answer].filter(c=>c!==' ').every(c=>guessed.has(c));if(won){done=true;stopWordTimer();score+=Math.max(10,60-wrong*10);$('#score').textContent=score;$('#win').classList.remove('hidden');}else if(wrong>=6){done=true;stopWordTimer();$('#lose').textContent='Hết lượt! Đáp án: '+answer.toLocaleUpperCase();$('#lose').classList.remove('hidden');}renderWord();}

function applyWord(g){const p=g.progress;done=p.done;stopWordTimer();$('#timer-label').classList.add('hidden');renderWord(p,g.challenge);$('#wrong').textContent=p.wrong+'/6';$('#score').textContent=p.score;if(p.done&&!p.lastAction?.won){$('#lose').classList.remove('hidden');$('#status').textContent='Hết lượt! Đáp án: '+(p.display||'');}else if(p.done){$('#win').classList.remove('hidden');$('#status').textContent='🎉 Đoán đúng từ bí mật!';}}
$('#new').onclick=()=>{if(online)return;startWord();};startWord();
const params=new URLSearchParams(location.search);if(params.get('online')==='1'&&params.get('room'))enterRoom(params.get('room')).catch(e=>status('Không thể khôi phục phòng: '+e.message));
</script></body></html>
