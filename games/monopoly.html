<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Cờ tỷ phú · Gamevui.net</title><style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:14px;display:flex;justify-content:center}main{width:min(100%,820px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.back,button,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub,.muted{color:var(--muted);font-size:13px}.sub{margin:4px 0 16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.space{min-height:82px;padding:7px 3px;border:1px solid var(--line);border-radius:12px;background:#26364b;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:3px}.space.here{outline:2px solid var(--accent);background:#3a506c}.space strong{font-size:12px}.players{display:flex;gap:7px;flex-wrap:wrap}.player{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#26364b;font-size:12px}.player.active{outline:2px solid var(--accent)}.hidden{display:none!important}input{min-width:0;width:100%}@media(max-width:430px){.space{min-height:70px;font-size:10px}.space strong{font-size:10px}button{padding:9px 11px}}

/* Responsive touch layout shared by standalone games */
@media(max-width:760px){
 body{padding: max(8px,env(safe-area-inset-top)) 9px calc(10px + env(safe-area-inset-bottom));font-size:14px;overscroll-behavior-y:contain}
 main{width:100%;max-width:100%;min-width:0}
 .top{gap:7px;margin-bottom:10px;flex-wrap:wrap}
 .top h1,h1{font-size:clamp(20px,5vw,27px)}
 .panel{padding:10px;margin-bottom:9px;border-radius:13px}
 button,.back,input,select{min-height:40px;touch-action:manipulation}
 .row,.controls{gap:6px}
 .sub,.muted,.hint{font-size:12px}
 .scoreboard,.scores{gap:5px}
}
@media(max-width:760px) and (orientation:landscape){
 body{min-height:100dvh;padding:4px 10px calc(5px + env(safe-area-inset-bottom))}
 main{max-width:1100px}
 .top{margin-bottom:5px}
 .sub{margin:2px 0 6px}
 .panel{padding:7px;margin-bottom:6px}
 #board{margin:6px auto;max-height:calc(100dvh - 120px)}
 .board{max-height:calc(100dvh - 120px)}
 .controls{margin:5px 0}
 .hint{margin:4px 0}
}
@media(hover:none){button,a,.tile,.cell,.square{-webkit-tap-highlight-color:transparent;touch-action:manipulation}}

</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🏙️ Cờ tỷ phú</h1><p class="sub">Gieo xúc xắc, mua bất động sản và quản lý tài sản để trở thành người chiến thắng.</p>
<section class="panel" id="mode-panel"><h2>Chọn chế độ chơi</h2><p class="muted">Bạn có thể chơi tại chỗ hoặc tạo phòng trực tuyến cho 2–4 người.</p><div class="row"><button class="primary" id="local-mode">👥 Chơi cùng thiết bị</button><button id="online-mode">🌐 Chơi trực tuyến</button></div><div id="online-options" class="hidden" style="margin-top:12px"><button class="primary" id="create-room">＋ Tạo phòng công khai</button><div class="row" style="margin-top:9px"><input id="room-code" maxlength="20" placeholder="Nhập mã phòng"><button id="join-room">Tham gia</button></div><p id="online-status" class="status" aria-live="polite"></p></div></section>
<section class="panel hidden" id="setup"><div class="row"><label for="players">Người chơi</label><select id="players"><option value="2">2 người</option><option value="3">3 người</option><option value="4">4 người</option></select><button id="new" class="primary">Ván mới</button></div></section>
<section class="panel hidden" id="game-panel"><div class="row" style="justify-content:space-between"><strong id="turn">Chờ bắt đầu</strong><button id="roll">🎲 Gieo xúc xắc</button></div><p id="status" class="status" aria-live="polite"></p><div id="players-list" class="players"></div><div id="board" class="board" style="margin-top:12px"></div><div id="actions" class="row" style="margin-top:12px"></div><div id="log" class="muted" style="margin-top:10px;max-height:110px;overflow:auto"></div><div class="muted" style="margin-top:9px">Bản chơi thử dùng bản đồ 16 ô và xu ảo, không có giao dịch tiền thật.</div></section></main>
<script>'use strict';
const spaces=[['BẮT ĐẦU','start',0],['Phố Hoa','property',120],['Cơ hội','chance',0],['Đại lộ Xanh','property',160],['Thuế thành phố','tax',100],['Bến cảng','property',180],['Nhà tù','jail',0],['Phố Ánh Dương','property',200],['Quỹ cộng đồng','chance',0],['Trung tâm','property',240],['Bãi đỗ xe','rest',0],['Khu vườn','property',260],['Thuế xa xỉ','tax',120],['Phố Biển','property',300],['Cơ hội','chance',0],['Khu thương mại','property',340]];
let mode='local',players=[],turn=0,rolled=false,owners={},finished=false,onlineState=null,token='',room='',source=null,logLines=[];
const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function profileToken(){let v=localStorage.getItem('samuno:profile-token');if(!v){const b=new Uint8Array(32);crypto.getRandomValues(b);v=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('samuno:profile-token',v)}return v}
async function api(url,data){const r=await fetch(url,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'request_failed');return d}
function say(s){logLines.unshift(s);logLines=logLines.slice(0,8);$('#status').textContent=s;$('#log').innerHTML=logLines.map(x=>'<div>• '+safe(x)+'</div>').join('')}
function showGame(){ $('#mode-panel').classList.add('hidden');$('#setup').classList.toggle('hidden',mode!=='local');$('#game-panel').classList.remove('hidden')}
function localStart(){const n=Number($('#players').value);players=Array.from({length:n},(_,i)=>({name:'Người chơi '+(i+1),money:1500,pos:0,alive:true}));turn=0;rolled=false;owners={};finished=false;logLines=[];showGame();say('Ván mới bắt đầu. Người chơi 1 đi trước.');renderLocal()}
function renderBoard(ps,owner){const b=$('#board');b.innerHTML='';spaces.forEach((s,i)=>{const here=ps.filter(p=>p.alive&&p.position===i).map(p=>'P'+(p.seat+1)).join(' '),own=owner[i];const d=document.createElement('div');d.className='space'+(here?' here':'');d.innerHTML='<strong>'+safe(s[0])+'</strong><span>'+(s[2]?'Giá '+s[2]+' xu':'')+'</span><span>'+(own!==undefined?'👑 P'+(own+1):'')+'</span><b>'+safe(here)+'</b>';b.append(d)})}
function renderLocal(){const ps=players.map((p,i)=>({...p,seat:i,position:p.pos}));renderBoard(ps,owners);$('#players-list').innerHTML=ps.map(p=>'<span class="player '+(p.seat===turn?'active':'')+'">'+(p.alive?'🟢':'⚫')+' P'+(p.seat+1)+' · '+p.money+' xu</span>').join('');$('#turn').textContent=finished?'Ván đấu kết thúc':'Lượt của '+players[turn].name;$('#roll').disabled=rolled||finished;renderLocalActions()}
function renderLocalActions(){const a=$('#actions');a.innerHTML='';if(!rolled||finished)return;const p=players[turn],s=spaces[p.pos];if(s[1]==='property'&&owners[p.pos]===undefined){const buy=document.createElement('button');buy.className='primary';buy.textContent='Mua '+s[0]+' · '+s[2]+' xu';buy.disabled=p.money<s[2];buy.onclick=()=>{p.money-=s[2];owners[p.pos]=turn;say(p.name+' đã mua '+s[0]);endLocalTurn()};a.append(buy)}const end=document.createElement('button');end.textContent='Kết thúc lượt';end.onclick=endLocalTurn;a.append(end)}
function endLocalTurn(){rolled=false;const alive=players.map((p,i)=>p.alive?i:-1).filter(i=>i>=0);if(alive.length<=1){finished=true;say('🏆 '+(players[alive[0]]?.name||'Không có người thắng')+' chiến thắng!')}else{do{turn=(turn+1)%players.length}while(!players[turn].alive)}renderLocal()}
$('#roll').onclick=()=>{if(mode==='online')return onlineAction('roll');if(rolled||finished)return;const p=players[turn],dice=1+Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6),old=p.pos;p.pos=(old+dice)%spaces.length;if(p.pos<old){p.money+=200;say(p.name+' đi qua BẮT ĐẦU và nhận 200 xu.')}const s=spaces[p.pos];rolled=true;if(s[1]==='tax')p.money-=s[2];else if(s[1]==='chance'){const delta=[100,-80,150,-50][Math.floor(Math.random()*4)];p.money+=delta;say(p.name+(delta>=0?' nhận ':' trả ')+Math.abs(delta)+' xu từ thẻ may mắn.')}else if(s[1]==='property'&&owners[p.pos]!==undefined&&owners[p.pos]!==turn){const rent=Math.round(s[2]*.15);p.money-=rent;players[owners[p.pos]].money+=rent;say(p.name+' trả '+rent+' xu tiền thuê.')}else say(p.name+' gieo được '+dice+' và đến '+s[0]+'.');if(p.money<0){p.alive=false;say(p.name+' phá sản!');endLocalTurn();return}renderLocal()};
$('#new').onclick=localStart;$('#local-mode').onclick=()=>{mode='local';showGame();localStart()};$('#online-mode').onclick=()=>$('#online-options').classList.toggle('hidden');
async function connect(code){room=code;let saved={};try{saved=JSON.parse(localStorage.getItem('samuno:'+room)||'{}')}catch{}const joined=await api('/api/join',{room,game:'monopoly',token:saved.token||'',name:'Người chơi',profileToken:profileToken()});token=joined.token;localStorage.setItem('samuno:'+room,JSON.stringify({token}));mode='online';showGame();if(source)source.close();source=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));source.onmessage=e=>{try{onlineState=JSON.parse(e.data);renderOnline()}catch{}};onlineState=joined.state;renderOnline()}
$('#create-room').onclick=async()=>{try{const r=await api('/api/room/create',{game:'monopoly',isPrivate:false});await connect(r.room)}catch(e){$('#online-status').textContent='Không tạo được phòng: '+e.message}};
$('#join-room').onclick=async()=>{try{const code=$('#room-code').value.trim().toUpperCase();if(!code)throw Error('Hãy nhập mã phòng');await connect(code)}catch(e){$('#online-status').textContent='Không tham gia được: '+e.message}};
async function onlineAction(type){try{await api('/api/action',{room,token,command:{type}})}catch(e){say('Thao tác không thành công: '+e.message)}}
async function renderOnline(){const g=onlineState?.game;if(!g){$('#turn').textContent='Phòng '+room+' · '+(onlineState?.players?.length||0)+'/4 người';$('#status').textContent='Chờ chủ phòng bắt đầu khi có ít nhất 2 người.';$('#board').innerHTML='';$('#players-list').innerHTML=(onlineState?.players||[]).map(p=>'<span class="player">'+safe(p.name)+(p.connected?' · Online':' · Mất kết nối')+'</span>').join('');$('#actions').innerHTML='';if(onlineState?.isHost&&onlineState.players.length>=2){const b=document.createElement('button');b.className='primary';b.textContent='Bắt đầu ván';b.onclick=async()=>{try{await api('/api/start',{room,token,game:'monopoly'})}catch(e){say('Không thể bắt đầu: '+e.message)}};$('#actions').append(b)}$('#roll').disabled=true;return}
const ps=g.players;renderBoard(ps,g.owners);$('#players-list').innerHTML=ps.map(p=>'<span class="player '+(p.seat===g.turn?'active':'')+'">'+(p.alive?'🟢':'⚫')+' '+safe(p.name)+' · '+p.money+' xu</span>').join('');$('#turn').textContent=g.winner>=0?'🏆 '+safe(ps[g.winner].name)+' chiến thắng':(g.myTurn?'Lượt của bạn':'Lượt của '+safe(ps[g.turn].name));$('#status').textContent=(g.lastRoll?'🎲 '+g.lastRoll.join(' + ')+' = '+g.lastRoll.reduce((a,b)=>a+b,0)+' · ':'')+(g.message||'');$('#roll').disabled=!g.myTurn||g.rolled||g.winner>=0;$('#actions').innerHTML='';if(g.myTurn&&g.rolled&&g.winner<0){const s=g.spaces[ps[g.mySeat].position];if(s[1]==='property'&&g.owners[ps[g.mySeat].position]===undefined){const buy=document.createElement('button');buy.className='primary';buy.textContent='Mua '+s[0]+' · '+s[2]+' xu';buy.disabled=ps[g.mySeat].money<s[2];buy.onclick=()=>onlineAction('buy');$('#actions').append(buy)}const end=document.createElement('button');end.textContent='Kết thúc lượt';end.onclick=()=>onlineAction('end');$('#actions').append(end)}}
const params=new URLSearchParams(location.search);if(params.get('online')==='1'&&params.get('room'))connect(params.get('room')).catch(e=>{$('#mode-panel').classList.remove('hidden');$('#online-options').classList.remove('hidden');$('#online-status').textContent='Không thể kết nối phòng: '+e.message});</script></body></html>
