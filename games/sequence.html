<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Bấm ô theo thứ tự · Gamevui.net</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--line:#ffffff1c;--text:#f4f7fb;--muted:#aab6c8;--accent:#f3b64b;--cyan:#64d8ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#354968,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:16px;display:flex;justify-content:center}main{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,button,select,input{border:1px solid var(--line);border-radius:12px;background:#26364b;color:var(--text);padding:10px 14px;font:inherit;font-weight:700}.back{color:inherit;text-decoration:none}.primary{background:var(--accent);color:#241b0b;border:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 10px 30px #0002}h1{font-size:clamp(30px,7vw,44px);margin:0;color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.status{color:#ffe09a;font-weight:750;min-height:24px}.grid{display:grid;gap:7px}.tile{border:1px solid var(--line);background:#26364b;border-radius:12px;min-width:0;display:grid;place-items:center;cursor:pointer;user-select:none}.tile:disabled{cursor:default;opacity:1}.tile.active{outline:3px solid var(--accent);background:#3a506c}.tile.good{background:#155b47}.tile.bad{background:#783b42}.primary,.tile,button{touch-action:manipulation}button:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} @media(max-width:480px){body{padding:11px}.panel{padding:12px}}
</style></head><body><main><header class="top"><a class="back" href="/">← Game Hub</a><span class="muted">GAMEVUI.NET</span></header><h1>🔢 Bấm ô theo thứ tự</h1><p class="sub">Quan sát các ô sáng và bấm theo thứ tự tăng dần. Mỗi lượt sẽ khó hơn.</p>
<section class="panel"><div class="row" style="justify-content:space-between"><div><div class="muted">ĐIỂM</div><strong id="score">0</strong></div><div><div class="muted">CẤP ĐỘ</div><strong id="level">1</strong></div><div><div class="muted">LƯỢT</div><strong id="round">0</strong></div><button class="primary" id="start">Bắt đầu</button></div></section>
<section class="panel"><p id="hint" class="status" aria-live="polite">Nhấn Bắt đầu để xem các ô sáng.</p><div id="board" class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:520px;margin:auto"></div><div class="muted" style="margin-top:12px">Bấm các ô theo số thứ tự tăng dần. Sai một ô sẽ kết thúc lượt chơi.</div></section></main><script>'use strict';const board=document.querySelector('#board'),hint=document.querySelector('#hint');let level=1,score=0,round=0,sequence=[],next=1,locked=true;function draw(){board.innerHTML='';const n=Math.min(16,8+Math.floor((level-1)/2)*2);for(let i=0;i<n;i++){const b=document.createElement('button');b.className='tile';b.style.aspectRatio='1';b.dataset.n=String(i+1);b.textContent='';b.addEventListener('click',()=>pick(i+1,b));board.append(b)}}function update(){document.querySelector('#score').textContent=score;document.querySelector('#level').textContent=level;document.querySelector('#round').textContent=round}function pick(n,b){if(locked)return;if(n===sequence[next-1]){b.classList.add('good');b.textContent=String(next);next++;if(next>sequence.length){locked=true;score+=level*10;round++;level=Math.min(10,level+1);update();hint.textContent='Chính xác! Chuẩn bị lượt tiếp theo.';setTimeout(play,650)}}else{b.classList.add('bad');locked=true;hint.textContent='Chưa đúng thứ tự. Điểm của bạn: '+score+'. Nhấn Bắt đầu để chơi lại.';document.querySelector('#start').textContent='Chơi lại'}}function play(){draw();sequence=Array.from({length:board.children.length},(_,i)=>i+1).sort(()=>Math.random()-.5).slice(0,Math.min(3+level,10)).sort((a,b)=>a-b);locked=true;hint.textContent='Hãy quan sát thứ tự các ô sáng…';sequence.forEach((n,i)=>setTimeout(()=>{const b=board.querySelector('[data-n="'+n+'"]');if(b){b.classList.add('active');b.textContent=String(i+1)}},450+i*500));setTimeout(()=>{board.querySelectorAll('.tile').forEach(b=>{b.classList.remove('active');b.textContent=''});next=1;locked=false;hint.textContent='Bấm các ô theo thứ tự 1 → '+sequence.length},450+sequence.length*500)}document.querySelector('#start').addEventListener('click',()=>{level=1;score=0;round=0;update();document.querySelector('#start').textContent='Chơi lại';play()});draw();update();</script></body></html>
