</style></head><body><main><h1>🃏 Sâm & UNO · Green Casino</h1><div id="app"><div class="panel">Đang tải…</div></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let room='',token='',state=null,source=null,selected=new Set(),selectedUno=[],wildCard=null,error='',soundEnabled=localStorage.getItem('samuno:sound')!=='off',lastWinnerKey='',sortMode='rank',hintedCard=null,lastChatId='',lastEmoteId='',lastHistoryId='';
const soundPrefs={card:localStorage.getItem('samuno:s-card')!=='off',win:localStorage.getItem('samuno:s-win')!=='off',effect:localStorage.getItem('samuno:s-effect')!=='off'};
function playTone(freq=520,duration=.11,type='card'){if(!soundEnabled||!soundPrefs[type])return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),gain=ctx.createGain();o.type='triangle';o.frequency.value=freq;gain.gain.setValueAtTime(.09,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(gain);gain.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);o.onended=()=>ctx.close();}catch{}}
function playCardSound(){playTone(680,.09,'card');setTimeout(()=>playTone(920,.055,'card'),35)}
function playApplause(){if(!soundEnabled||!soundPrefs.win)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C();for(let i=0;i<18;i++){const start=ctx.currentTime+i*.085,buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.045),ctx.sampleRate),d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);const src=ctx.createBufferSource(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();src.buffer=buf;filter.type='bandpass';filter.frequency.value=1100+Math.random()*1500;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.11,start+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+.05);src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(start);src.stop(start+.05)}setTimeout(()=>ctx.close(),1900)}catch{}}
function playWinSound(){if(!soundEnabled||!soundPrefs.win)return;[523,659,784,1047].forEach((n,i)=>setTimeout(()=>playTone(n,.22,'win'),i*110));playApplause()}
function showTicker(msg){let el=$('#global-ticker');if(!el){el=document.createElement('div');el.id='global-ticker';el.className='global-ticker';document.body.appendChild(el);}el.innerHTML='<span class="ticker-message"></span>';const item=el.firstChild;item.textContent=msg;item.style.animation='none';void item.offsetWidth;item.style.animation='tickerScroll 8s linear both';item.addEventListener('animationend',()=>{el.remove();},{once:true});}
function showSamCallAlert(name){const old=$('#sam-call-alert');if(old)old.remove();const el=document.createElement('div');el.id='sam-call-alert';el.className='uno-alert';el.innerHTML='<div class="uno-alert-card" style="background:radial-gradient(ellipse,#176b3c,#07351e);border-color:#83f0aa"><div class="uno-alert-title" style="color:#a6ffc4;text-shadow:0 5px 0 #07552b,0 0 22px #5dff9a">🌿 SÂM!</div><div class="uno-alert-name"></div></div>';el.querySelector('.uno-alert-name').textContent=name+' đã báo Sâm';document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});playTone(660,.18,'effect');setTimeout(()=>playTone(990,.2,'effect'),140);setTimeout(()=>playTone(1320,.24,'effect'),280);}
function showUnoAlert(name){const old=$('#uno-alert');if(old)old.remove();const el=document.createElement('div');el.id='uno-alert';el.className='uno-alert';el.innerHTML='<div class="uno-alert-card"><div class="uno-alert-title">🔴 UNO!</div><div class="uno-alert-name"></div></div>';el.querySelector('.uno-alert-name').textContent=name+' đã báo UNO';document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});playTone(880,.16,'effect');setTimeout(()=>playTone(1175,.2,'effect'),130);setTimeout(()=>playTone(1568,.24,'effect'),270);}

function showFloatingEmote(emote,name){const old=$('#floating-emote');if(old)old.remove();const el=document.createElement('div');el.id='floating-emote';el.style.cssText='position:fixed;z-index:1150;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-size:clamp(58px,16vw,108px);filter:drop-shadow(0 8px 16px #000b);animation:floatEmote 1.8s ease-out both';const label=document.createElement('div');label.textContent=name+' thả cảm xúc';label.style.cssText='font-size:15px;font-weight:850;color:#fff;background:#071b12dd;border:1px solid #ffffff44;border-radius:20px;padding:5px 12px;margin-top:4px';el.textContent=emote;el.appendChild(label);document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}
function showActionFx(symbol,label,sub=''){const old=$('#action-fx');if(old)old.remove();const el=document.createElement('div');el.id='action-fx';el.className='action-fx';el.innerHTML='<div class="action-fx-inner"><div class="action-fx-symbol"></div><div class="action-fx-label"></div><div class="action-fx-sub"></div></div>';el.querySelector('.action-fx-symbol').textContent=symbol;el.querySelector('.action-fx-label').textContent=label;el.querySelector('.action-fx-sub').textContent=sub;document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});playTone(740,.12,'effect');setTimeout(()=>playTone(1040,.16,'effect'),90);}
function showUnoCardEffect(g,h){const card=g?.top||'',kind=card[1],name=g?.names?.[h.seat]||'';if(kind==='D'||kind==='F'){const amount=g.pendingDraw?.amount||(kind==='D'?2:4);showActionFx('+'+amount,amount>4?'CỘNG DỒN BÀI PHẠT':'RÚT '+amount+' LÁ',name+' vừa đánh '+(kind==='D'?'+2':'+4'));}
else if(kind==='S')showActionFx('⊘','CẤM LƯỢT',name+' đã bỏ lượt người tiếp theo');
else if(kind==='V')showActionFx('⇄','ĐỔI CHIỀU',name+' đã đảo chiều chơi');
else if(kind==='W')showActionFx('🌈','ĐỔI MÀU',name+' đã chọn màu '+({R:'ĐỎ',G:'XANH LÁ',B:'XANH DƯƠNG',Y:'VÀNG'})[g.color]);
else showActionFx(card[1]||'🃏','ĐÁNH BÀI',name+' vừa đánh một lá bài');}
function showSamSuccess(name){const old=$('#sam-success');if(old)old.remove();const el=document.createElement('div');el.id='sam-success';el.textContent='✨ BÁO SÂM THÀNH CÔNG · '+name+' ✨';document.body.appendChild(el);setTimeout(()=>el.remove(),1400)}
function shakeTable(){const el=$('.felt');if(el){el.classList.remove('table-shake');void el.offsetWidth;el.classList.add('table-shake')}}

function leaderboard(names,scores){return [...names].map((name,i)=>({name,score:scores?.[i]||0,i})).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,3).map((p,i)=>`<span class="rank-chip">${['🥇','🥈','🥉'][i]} ${esc(p.name)} · ${p.score}đ</span>`).join('');}
async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...data,room,token})});const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');return j;}
function connect(){
if(source)source.close();
source=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));
source.onmessage=e=>{
const next=JSON.parse(e.data),old=state,og=old?.game,g=next.game;
let tickerMessage='',doShake=false;
const oldChat=old?.chat?.at(-1)?.id||'',newChat=next.chat?.at(-1);
if(newChat&&newChat.id!==oldChat&&old)tickerMessage='💬 '+newChat.name+': '+newChat.text;
const oldEmote=old?.emotes?.at(-1)?.id||'',newEmote=next.emotes?.at(-1);
if(newEmote&&newEmote.id!==oldEmote&&old){tickerMessage='✨ '+newEmote.name+' thả cảm xúc '+newEmote.emote;showFloatingEmote(newEmote.emote,newEmote.name);}
const h=g?.history?.at(-1),oh=og?.history?.at(-1);
const hk=h?String(h.at)+':'+h.type+':'+h.text:'',ohk=oh?String(oh.at)+':'+oh.type+':'+oh.text:'';
if(h&&hk!==ohk){
if(h.type==='uno'){tickerMessage='🔴 '+h.text+'!';showUnoAlert(g.names[h.seat]||h.text.replace(/ báo UNO$/,''));}
else if(h.type==='call'){tickerMessage='🌿 '+h.text+'!';if(g.type==='sam')showSamCallAlert(g.names[h.seat]||h.text.replace(/ báo Sâm$/,''));}
else if(h.type==='play'){if(g.type==='uno'){showUnoCardEffect(g,h);if(g.pendingDraw?.amount>4){tickerMessage='⚡ '+h.text+' · TỔNG PHẠT +'+g.pendingDraw.amount;doShake=true;}}else{const n=g.last?.length||0;showActionFx(n+' LÁ','ĐÁNH BÀI SÂM',g.names[h.seat]||h.text);if(og?.last?.length){const prev=og.last,wasTwo=prev.length===1&&(prev[0]>>2)===15,wasQuad=prev.length===4&&prev.every(x=>(x>>2)===(prev[0]>>2));if(wasTwo||wasQuad){doShake=true;tickerMessage='⚡ '+h.text+' · CHẶT BÀI!'}}}}else if(h.type==='draw'){showActionFx('🂠','BỐC BÀI',h.text);}else if(h.type==='penalty'){const penalty=h.text.match(/rút (\\d+) lá/i);showActionFx(penalty?'+'+penalty[1]:'🂠','NHẬN BÀI PHẠT',h.text);}
}
if(g&&g.winner>=0){const key=room+':'+g.winner+':'+(g.scores||[]).join(',');if(key!==lastWinnerKey){lastWinnerKey=key;playWinSound();tickerMessage='🏆 '+g.names[g.winner]+' đã chiến thắng!';if(g.type==='sam'&&g.samCalled===g.winner)showSamSuccess(g.names[g.winner]);}}else lastWinnerKey='';
state=next;render();

};
source.onerror=()=>{error='Mất kết nối tạm thời. Đang thử kết nối lại…';render()};
}function rank(c){return ({11:'J',12:'Q',13:'K',14:'A',15:'2'})[c>>2]||(c>>2)}function samCard(c,sel){return `<div class="card ${((c&3)>1?'red':'')} ${sel?'selected':''}" data-card="${c}">${rank(c)}<small>${'♠♣♦♥'[c&3]}</small></div>`}function samTableCard(c){return `<div class="card ${((c&3)>1?'red':'')}">${rank(c)}<small>${'♠♣♦♥'[c&3]}</small></div>`}function unoCard(k,sel){const v=({S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'})[k[1]]||k[1];return `<div class="card ${k[0]} ${sel?'selected':''}" data-uno="${k}">${v}</div>`}function unoTableCard(k){const v=({S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'})[k[1]]||k[1];return `<div class="card ${k[0]}">${v}</div>`}
function chatPanel(){
if(!state)return '';
const messages=(state.chat||[]).map(m=>'<div class="chat-line"><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>').join('')||'<span class="muted">Chưa có bình luận nào.</span>';
const emotes=['😀','😂','😍','😮','😢','😎','👏','🔥','🎉','💪','🤔','❤️'];
const buttons=emotes.map(x=>'<button data-emote="'+x+'">'+x+'</button>').join('');
const recent=(state.emotes||[]).slice(-6).map(x=>'<span class="emote-pill">'+esc(x.name)+' '+x.emote+'</span>').join('');
return '<div class="chat-box"><b>💬 Bình luận trong phòng</b><div class="chat-list">'+messages+'</div><div class="chat-controls"><input id="chat-message" maxlength="180" placeholder="Viết bình luận..."><button data-action="chat-send">Gửi</button></div><div class="muted">Thả cảm xúc</div><div class="emote-row">'+buttons+'</div><div class="emote-feed">'+recent+'</div></div>';
}

function localCombo(cards){if(!cards||!cards.length)return null;const ranks=cards.map(x=>x>>2).sort((a,b)=>a-b);if(ranks.every(x=>x===ranks[0]))return {kind:'set',size:ranks.length,high:ranks[0]};if(ranks.length>=3&&ranks.at(-1)<15&&ranks.every((x,i)=>i===0||x===ranks[i-1]+1))return {kind:'run',size:ranks.length,high:ranks.at(-1)};return null;}
function samHint(hand,lastCards){const sorted=[...hand];const last=localCombo(lastCards);let best=null;function beatsLocal(a,b){if(!b)return true;if(a.kind==='set'&&a.size===4&&b.kind==='set'&&b.size===1&&b.high===15)return true;return a.kind===b.kind&&a.size===b.size&&a.high>b.high;}function visit(start,pick){if(pick.length){const remain=hand.filter(x=>!pick.includes(x));const valid=!(remain.length===0&&pick.some(x=>(x>>2)===15))&&!(remain.length===1&&(remain[0]>>2)===15);const cm=valid?localCombo(pick):null;if(cm&&beatsLocal(cm,last)&&(!best||pick.length<best.length))best=[...pick];}for(let j=start;j<sorted.length;j++){pick.push(sorted[j]);visit(j+1,pick);pick.pop();}}visit(0,[]);return best;}
function historyPanel(g){return '<div class="panel history-panel"><b>📜 Lịch sử ván đấu</b><div class="history-list">'+(g.history||[]).slice().reverse().map(x=>'<div class="history-item">'+esc(x.text)+'</div>').join('')+'</div></div>';}
function profilePanel(players){return '<div class="panel"><b>👤 Hồ sơ người chơi</b><div class="profile-grid">'+players.map(p=>'<div class="profile"><b>🎴 '+esc(p.name)+'</b><div class="muted">'+(p.bot?'Bot':'Người chơi')+' · '+(p.wins||0)+' thắng · '+(p.score||0)+' điểm</div><div class="muted">'+(p.games||0)+' ván · Chuỗi '+(p.streak||0)+' · Kỷ lục '+(p.bestStreak||0)+'</div></div>').join('')+'</div></div>';}
function nextSeatIndex(g){if(!g||!g.names?.length)return -1;const n=g.names.length;const last=g.history?.at(-1);if(g.type==='uno'&&n===2&&last?.type==='play'&&['V','S'].includes(g.top?.[1]))return g.turn;return (g.turn+(g.direction||1)+n)%n;}
function updateClock(){const el=$('#turn-clock');if(!el||!state?.game)return;const left=Math.max(0,Math.ceil(((state.game.turnDeadline||Date.now()+25000)-Date.now())/1000));el.textContent=left+' giây';el.classList.toggle('timer-danger',left<=5);}

function render(){const a=$('#app');const previousHand=a.querySelector('.hand');const previousHandScroll=previousHand?previousHand.scrollLeft:0;if(!token){a.innerHTML=`<div class="panel"><div class="row"><input id="name" maxlength="24" placeholder="Tên người chơi"><input id="room" maxlength="20" placeholder="Mã phòng (tuỳ chọn)"><button data-action="join">Vào bàn</button></div><div class="muted">Nhập cùng mã phòng để chơi cùng bạn bè. Trạng thái ván được máy chủ quản lý.</div>${error?`<p class="status">${esc(error)}</p>`:''}${chatPanel()}</div>`;return;}if(!state){a.innerHTML='<div class="panel">Đang kết nối phòng…</div>';return;}const players=state.players||[],g=state.game;if(!g){const ranked=[...players].sort((x,y)=>(y.score||0)-(x.score||0)).slice(0,3);a.innerHTML=`<div class="panel"><div class="big">Sảnh phòng · ${esc(room)}</div><div class="muted">🏆 BẢNG XẾP HẠNG TOP 3</div><div class="leaderboard">${ranked.map((p,i)=>`<span class="rank-chip">${['🥇','🥈','🥉'][i]} ${esc(p.name)} · ${p.score||0}đ</span>`).join('')||'Chưa có điểm'}</div><div class="row">${players.map(p=>`<span class="seat">${esc(p.name)} · ${p.score||0} điểm ${p.connected?'':'(mất kết nối)'}</span>`).join('')}</div><div class="row"><button data-action="bot">＋ Thêm Bot</button><button data-action="start-sam">Chơi Sâm</button><button data-action="start-uno">Chơi UNO</button></div>${error?`<p class="status">${esc(error)}</p>`:''}</div>`;a.innerHTML+=`${profilePanel(players)}${chatPanel()}`;return;}
const my=g.mySeat,hand=g.hand||[],sam=g.type==='sam',nextSeat=nextSeatIndex(g);const sortedHand=[...hand].sort((a,b)=>sortMode==='suit'?((a&3)-(b&3)||((a>>2)-(b>>2))):((a>>2)-(b>>2)||((a&3)-(b&3))));let html=`<div class="turn-overview"><span>▶ ĐANG ĐÁNH: <b>${esc(g.names[g.turn]||'—')}</b></span><span>⏭ TIẾP THEO: <b>${g.winner>=0?'—':esc(g.names[nextSeat]||'—')}</b></span></div><div class="row">${g.names.map((n,i)=>`<span class="seat ${i===g.turn?'turn current-turn':''} ${i===nextSeat&&g.winner<0?'next-turn':''} ${i===g.winner?'winner-seat':''}">${i===g.turn?'<span class="turn-tag current-tag">▶ ĐANG ĐÁNH</span>':''}${i===nextSeat&&g.winner<0?'<span class="turn-tag next-tag">⏭ TIẾP THEO</span>':''}${i===g.winner?'👑 ':''}${esc(n)} · ${g.counts[i]} lá · ${g.scores[i]||0} điểm</span>`).join('')}</div><div class="panel"><div class="muted">🏆 BẢNG XẾP HẠNG TOP 3</div><div class="leaderboard">${leaderboard(g.names,g.scores)}</div></div><div class="last-player-label">${g.history?.length?esc(g.history[g.history.length-1].text):'Chưa có lượt đánh'}</div><div class="felt">${sam?(g.last.length?g.last.map(c=>samTableCard(c)).join(''):'BÀN CHƠI SÂM'):unoTableCard(g.top)}${!sam?`<div>Màu: <b>${({R:'Đỏ',G:'Xanh lá',B:'Xanh dương',Y:'Vàng'})[g.color]}</b></div>`:''}</div><div id="live-ticker" class="live-ticker" style="display:none"></div><div class="panel">${g.winner>=0?'<div class="confetti">🎉 ✨ 🎊 ✨ 🎉</div><div class="winner-banner">👑 '+(g.matchWinner>=0?'NHÀ VÔ ĐỊCH':'VÁN ĐẤU KẾT THÚC')+' 👑<small>'+esc(g.names[g.winner])+' chiến thắng · +'+(g.roundPoints||1)+' ĐIỂM'+(g.matchWinner>=0?' · ĐẠT MỐC 500 ĐIỂM':'')+'</small></div><p class="muted">'+(g.matchWinner>=0?'Trận đấu đã kết thúc. Nhà vô địch đã đạt 500 điểm.':'Chọn “Ván mới” để chơi tiếp — điểm số vẫn được giữ trong phòng.')+'</p>':''}<div class="big">${g.winner>=0?'🏆 '+esc(g.names[g.winner])+' chiến thắng':g.turnLocked?'✨ ĐANG HIỂN THỊ HIỆU ỨNG...':g.myTurn?'ĐẾN LƯỢT BẠN':'Đang chờ '+esc(g.names[g.turn])}</div><div class="muted">${esc(g.message||'')}</div><div>⏳ Còn lại: <span class="timer" id="turn-clock">-- giây</span></div>${error?`<p class="status">${esc(error)}</p>`:''}`;
if(g.winner<0&&my>=0){html+=`<div class="row"><button data-action="sort">↕ Sắp xếp: ${sortMode==='rank'?'Giá trị':'Chất'}</button><button data-action="hint">💡 Gợi ý nước đánh</button></div><div class="hand">${sortedHand.map(c=>sam?samCard(c,selected.has(c)):unoCard(c,selectedUno.includes(c))).join('')}</div><div class="row">${sam?`<button data-action="play-sam" ${g.myTurn&&selected.size?'':'disabled'}>Đánh bài đã chọn</button><button data-action="pass" ${g.myTurn&&g.last.length?'':'disabled'}>Bỏ lượt</button><button data-action="call-sam" ${g.myTurn&&!g.last.length&&g.samCalled<0?'':'disabled'}>Báo Sâm</button>`:`<button data-action="draw" ${g.myTurn&&g.drawnCardSeat!==my&&!g.pendingDraw?'':'disabled'}>Bốc 1 lá</button>${g.drawnCardSeat===my?'<button data-action="pass-drawn">Bỏ lượt</button>':''}${g.pendingDraw&&g.pendingDraw.seat===my?'<button data-action="accept-penalty">Rút '+g.pendingDraw.amount+' lá phạt</button>':''}${g.myTurn&&hand.length===2&&!(g.unoPendingSeat===my&&g.unoCalled)?'<button data-action="uno">🔴 Báo UNO trước khi đánh</button>':''}${g.myTurn&&selectedUno.length?'<button data-action="play-uno">Đánh '+selectedUno.length+' lá đã chọn</button>':''}${g.unoPendingSeat>=0&&g.unoPendingSeat!==my&&!g.unoCalled?'<button data-action="catch-uno">Bắt lỗi UNO (+2)</button>':''}`}</div>`;}
if(!sam&&g.winner<0&&wildCard){html+=`<div class="row">Chọn màu: ${['R','G','B','Y'].map(c=>`<button data-color="${c}">${c}</button>`).join('')}</div>`;}html+=`<div class="row">${g.winner>=0&&g.matchWinner<0?'<button data-action="again">▶ Chơi ván tiếp theo</button>':''}<button data-action="lobby">Về sảnh</button><button data-action="sound" class="${soundEnabled?'sound-on':''}">${soundEnabled?'🔊 Âm thanh tổng bật':'🔇 Âm thanh tổng tắt'}</button></div>${soundSettingsPanel()}</div>`;html+=chatPanel();html+=historyPanel(g)+profilePanel(players);a.innerHTML=html;const newHand=a.querySelector('.hand');if(newHand)newHand.scrollLeft=previousHandScroll;updateClock();}
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-card],[data-uno],[data-color],[data-emote],[data-sound]');if(!b)return;const d=b.dataset;try{error='';if(d.action==='sort'){sortMode=sortMode==='rank'?'suit':'rank';}else if(d.action==='hint'){if(state?.game?.type==='sam'){const suggestion=samHint(state.game.hand||[],state.game.last||[]);if(suggestion)selected=new Set(suggestion);else error='Không tìm thấy nước đánh hợp lệ.';}else{const g=state.game,hand=g.hand||[];const card=hand.find(k=>k[0]==='W'||k[0]===g.color||k[1]===g.top[1]);if(card)hintedCard=card;else error='Không có lá UNO nào có thể đánh. Hãy bốc bài.';}}else if(d.action==='chat-send'){const field=$('#chat-message');await api('chat',{message:field?.value||''});}else if(d.emote){await api('emote',{emote:d.emote});}else if(d.action==='sound'){soundEnabled=!soundEnabled;localStorage.setItem('samuno:sound',soundEnabled?'on':'off');if(soundEnabled)playTone(620,.1,'effect');render();return;}if(d.sound){soundPrefs[d.sound]=!soundPrefs[d.sound];localStorage.setItem('samuno:s-'+d.sound,soundPrefs[d.sound]?'on':'off');if(soundPrefs[d.sound])playTone(620,.1,'effect');render();return;}if(d.action==='join'){room=$('#room').value.trim()||'chung';const name=$('#name').value.trim()||'Người chơi';const saved=JSON.parse(localStorage.getItem('samuno:'+room)||'null');const j=await (async()=>{const r=await fetch('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,name,token:saved?.token})});const x=await r.json();if(!r.ok)throw Error(x.error);return x;})();token=j.token;localStorage.setItem('samuno:'+room,JSON.stringify({token}));state=j.state;connect();render();return;}if(d.action==='bot')await api('bot');else if(d.action==='start-sam')await api('start',{game:'sam'});else if(d.action==='start-uno')await api('start',{game:'uno'});else if(d.action==='lobby')await api('lobby');else if(d.action==='again')await api('start',{game:state.game.type});else if(d.action==='draw')await api('action',{command:{type:'draw'}});else if(d.action==='pass')await api('action',{command:{type:'pass'}});else if(d.action==='call-sam')await api('action',{command:{type:'call_sam'}});else if(d.action==='uno')await api('action',{command:{type:'uno'}});else if(d.action==='catch-uno')await api('action',{command:{type:'catch_uno'}});else if(d.action==='accept-penalty')await api('action',{command:{type:'accept_penalty'}});else if(d.action==='pass-drawn')await api('action',{command:{type:'pass_drawn'}});else if(d.action==='play-sam'){await api('action',{command:{type:'play',cards:[...selected]}});selected.clear();}else if(d.card){playCardSound();hintedCard=null;const c=+d.card;selected.has(c)?selected.delete(c):selected.add(c);}else if(d.uno){const k=d.uno;hintedCard=null;const total=(state.game.hand||[]).filter(x=>x===k).length,chosen=selectedUno.filter(x=>x===k).length;if(chosen<total)selectedUno.push(k);else selectedUno=selectedUno.filter(x=>x!==k);wildCard=selectedUno.length&&selectedUno[0][0]==='W'?selectedUno[0]:null;}else if(d.action==='play-uno'){if(selectedUno.some(x=>x[0]==='W')){if(selectedUno.length===1)wildCard=selectedUno[0];else error='Lá đặc biệt không thể ghép đôi trong lượt này.';}else{await api('action',{command:{type:'play',cards:[...selectedUno]}});selectedUno=[];wildCard=null;}}else if(d.color&&wildCard){await api('action',{command:{type:'play',cards:[...selectedUno],color:d.color}});selectedUno=[];wildCard=null;}if(d.action==='again'||d.action==='play-sam'||d.action==='draw'||d.action==='pass'||d.action==='call-sam'||d.action==='start-sam'||d.action==='start-uno')playTone(570,.08,'effect');render();}catch(err){error=({game_in_progress:'Ván hiện tại vẫn đang diễn ra. Hãy chờ có người chiến thắng.',cannot_finish_with_two:'Không được kết thúc ván bằng lá 2.',cannot_leave_two_alone:'Không thể đánh nước này vì sẽ chỉ còn lại một lá 2.'})[err.message]||err.message;render();}});
render();setInterval(updateClock,1000);
