<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sâm & UNO</title>
<style>
:root{color-scheme:dark;--bg:#07150f;--panel:#10291d;--felt:#07532f;--gold:#e2bd62;--text:#f3f5e9;--muted:#b9c9bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173c29,var(--bg) 70%);color:var(--text);font:16px/1.45 system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:auto;padding:16px}h1{font-size:25px;margin:4px 0 14px}.panel{background:var(--panel);border:1px solid #ffffff24;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0003}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0}input,button{font:inherit;border-radius:10px;padding:10px 14px}input{background:#071b12;color:white;border:1px solid #ffffff35;min-width:120px}button{border:1px solid #e2bd6270;background:linear-gradient(#28754b,#14502f);color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.4;cursor:default}.seat{padding:8px 11px;border-radius:10px;background:#ffffff12;border:1px solid #ffffff20}.turn{outline:2px solid var(--gold)}.felt{min-height:160px;border:7px solid #6d482b;border-radius:26px;background:radial-gradient(ellipse,#0b7543,#064126);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px;box-shadow:inset 0 0 30px #001b0e}.hand{display:flex;overflow-x:auto;padding:25px 8px 8px;min-height:125px}.card{flex:none;width:58px;height:88px;margin-right:-13px;border:2px solid #f3ead5;border-radius:9px;background:#fff;color:#18231b;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:19px;font-weight:800;box-shadow:0 4px 9px #0005;cursor:pointer}.card.red{color:#c62828}.card.selected{transform:translateY(-17px);outline:2px solid var(--gold)}.card.R{background:#d83a37;color:white}.card.G{background:#299b59;color:white}.card.B{background:#277bd0;color:white}.card.Y{background:#f1d34c;color:#222}.card.W{background:#252525;color:white}.muted{color:var(--muted);font-size:14px}.big{font-size:20px;font-weight:750}.status{color:#f6d985;font-weight:700}.winner-seat{border-color:#e2bd62;background:linear-gradient(135deg,#70551c,#3b2d13);color:#ffe8a3;box-shadow:0 0 14px #e2bd6255}.winner-banner{margin:0 0 14px;padding:18px 12px;border:2px solid #e2bd62;border-radius:16px;text-align:center;background:radial-gradient(ellipse,#6d5420,#2b2412);color:#ffe8a3;font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:1px;box-shadow:0 0 24px #e2bd6244}.winner-banner small{display:block;font-size:14px;letter-spacing:0;font-weight:650;color:#fff1c5}

/* Hiệu ứng chiến thắng và bảng xếp hạng */
.winner-banner{animation:winnerPop .55s ease-out both}
@keyframes winnerPop{0%{transform:scale(.86);opacity:.25}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.confetti{display:flex;justify-content:center;gap:9px;font-size:25px;animation:confettiDrop 1.1s ease-out both}
@keyframes confettiDrop{0%{transform:translateY(-18px) scale(.5);opacity:0}35%{opacity:1}100%{transform:translateY(12px) scale(1);opacity:0}}
.leaderboard{display:flex;gap:8px;flex-wrap:wrap}.rank-chip{padding:7px 10px;border-radius:10px;background:#ffffff12;border:1px solid #ffffff22;font-size:13px}.sound-on{border-color:#e2bd62}
.chat-box{background:#071b12;border:1px solid #ffffff25;border-radius:12px;padding:10px;margin-top:12px}.chat-list{max-height:170px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}.chat-line{background:#ffffff0d;padding:6px 9px;border-radius:8px;overflow-wrap:anywhere}.chat-line b{color:#f3d47e}.chat-controls{display:flex;gap:7px;flex-wrap:wrap}.chat-controls input{flex:1;min-width:150px}.emote-row{display:flex;gap:6px;flex-wrap:wrap}.emote-row button{padding:6px 9px;font-size:19px}.emote-feed{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.emote-pill{background:#ffffff12;border-radius:20px;padding:5px 9px;font-size:13px}</style></head><body><main><h1>🃏 Sâm & UNO · Green Casino</h1><div id="app"><div class="panel">Đang tải…</div></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let room='',token='',state=null,source=null,selected=new Set(),wildCard=null,error='',soundEnabled=localStorage.getItem('samuno:sound')!=='off',lastWinnerKey='';
function playTone(freq=520,duration=.11){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=freq;gain.gain.setValueAtTime(.07,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(gain);gain.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);o.onended=()=>ctx.close();}catch{}}
function leaderboard(names,scores){return [...names].map((name,i)=>({name,score:scores?.[i]||0,i})).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,3).map((p,i)=>`<span class="rank-chip">${['🥇','🥈','🥉'][i]} ${esc(p.name)} · ${p.score}đ</span>`).join('');}
async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...data,room,token})});const j=await r.json();if(!r.ok)throw Error(j.error||'request_failed');return j;}
function connect(){if(source)source.close();source=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));source.onmessage=e=>{state=JSON.parse(e.data);const g=state.game;if(g&&g.winner>=0){const key=room+':'+g.winner+':'+(g.scores||[]).join(',');if(key!==lastWinnerKey){lastWinnerKey=key;playTone(760,.22);setTimeout(()=>playTone(960,.3),150);}}else lastWinnerKey='';render();};source.onerror=()=>{error='Mất kết nối tạm thời. Đang thử kết nối lại…';render();};}
function rank(c){return ({11:'J',12:'Q',13:'K',14:'A',15:'2'})[c>>2]||(c>>2)}function samCard(c,sel){return `<div class="card ${((c&3)>1?'red':'')} ${sel?'selected':''}" data-card="${c}">${rank(c)}<small>${'♠♣♦♥'[c&3]}</small></div>`}function samTableCard(c){return `<div class="card ${((c&3)>1?'red':'')}">${rank(c)}<small>${'♠♣♦♥'[c&3]}</small></div>`}function unoCard(k,sel){const v=({S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'})[k[1]]||k[1];return `<div class="card ${k[0]} ${sel?'selected':''}" data-uno="${k}">${v}</div>`}function unoTableCard(k){const v=({S:'⊘',V:'⇄',D:'+2',W:'🌈',F:'+4'})[k[1]]||k[1];return `<div class="card ${k[0]}">${v}</div>`}
function chatPanel(){
const messages=(state.chat||[]).map(m=>'<div class="chat-line"><b>'+esc(m.name)+':</b> '+esc(m.text)+'</div>').join('')||'<span class="muted">Chưa có bình luận nào.</span>';
const emotes=['😀','😂','😍','😮','😢','😎','👏','🔥','🎉','💪','🤔','❤️'];
const buttons=emotes.map(x=>'<button data-emote="'+x+'">'+x+'</button>').join('');
const recent=(state.emotes||[]).slice(-6).map(x=>'<span class="emote-pill">'+esc(x.name)+' '+x.emote+'</span>').join('');
return '<div class="chat-box"><b>💬 Bình luận trong phòng</b><div class="chat-list">'+messages+'</div><div class="chat-controls"><input id="chat-message" maxlength="180" placeholder="Viết bình luận..."><button data-action="chat-send">Gửi</button></div><div class="muted">Thả cảm xúc</div><div class="emote-row">'+buttons+'</div><div class="emote-feed">'+recent+'</div></div>';
}
function render(){const a=$('#app');const previousHand=a.querySelector('.hand');const previousHandScroll=previousHand?previousHand.scrollLeft:0;if(!token){a.innerHTML=`<div class="panel"><div class="row"><input id="name" maxlength="24" placeholder="Tên người chơi"><input id="room" maxlength="20" placeholder="Mã phòng (tuỳ chọn)"><button data-action="join">Vào bàn</button></div><div class="muted">Nhập cùng mã phòng để chơi cùng bạn bè. Trạng thái ván được máy chủ quản lý.</div>${error?`<p class="status">${esc(error)}</p>`:''}${chatPanel()}</div>`;return;}if(!state){a.innerHTML='<div class="panel">Đang kết nối phòng…</div>';return;}const players=state.players||[],g=state.game;if(!g){const ranked=[...players].sort((x,y)=>(y.score||0)-(x.score||0)).slice(0,3);a.innerHTML=`<div class="panel"><div class="big">Sảnh phòng · ${esc(room)}</div><div class="muted">🏆 BẢNG XẾP HẠNG TOP 3</div><div class="leaderboard">${ranked.map((p,i)=>`<span class="rank-chip">${['🥇','🥈','🥉'][i]} ${esc(p.name)} · ${p.score||0}đ</span>`).join('')||'Chưa có điểm'}</div><div class="row">${players.map(p=>`<span class="seat">${esc(p.name)} · ${p.score||0} điểm ${p.connected?'':'(mất kết nối)'}</span>`).join('')}</div><div class="row"><button data-action="bot">＋ Thêm Bot</button><button data-action="start-sam">Chơi Sâm</button><button data-action="start-uno">Chơi UNO</button></div>${error?`<p class="status">${esc(error)}</p>`:''}</div>`;return;}
const my=g.mySeat,hand=g.hand||[],sam=g.type==='sam';let html=`<div class="row">${g.names.map((n,i)=>`<span class="seat ${i===g.turn?'turn':''} ${i===g.winner?'winner-seat':''}">${i===g.winner?'👑 ':''}${esc(n)} · ${g.counts[i]} lá · ${g.scores[i]||0} điểm</span>`).join('')}</div><div class="panel"><div class="muted">🏆 BẢNG XẾP HẠNG TOP 3</div><div class="leaderboard">${leaderboard(g.names,g.scores)}</div></div><div class="felt">${sam?(g.last.length?g.last.map(c=>samTableCard(c)).join(''):'BÀN CHƠI SÂM'):unoTableCard(g.top)}${!sam?`<div>Màu: <b>${({R:'Đỏ',G:'Xanh lá',B:'Xanh dương',Y:'Vàng'})[g.color]}</b></div>`:''}</div><div class="panel">${g.winner>=0?'<div class="confetti">🎉 ✨ 🎊 ✨ 🎉</div><div class="winner-banner">👑 VÁN ĐẤU KẾT THÚC 👑<small>'+esc(g.names[g.winner])+' chiến thắng · +1 ĐIỂM</small></div><p class="muted">Ván đã kết thúc. Chọn “Ván mới” để chơi tiếp — điểm số vẫn được giữ trong phòng.</p>':''}<div class="big">${g.winner>=0?'🏆 '+esc(g.names[g.winner])+' chiến thắng':g.myTurn?'ĐẾN LƯỢT BẠN':'Đang chờ '+esc(g.names[g.turn])}</div><div class="muted">${esc(g.message||'')}</div>${error?`<p class="status">${esc(error)}</p>`:''}`;
if(g.winner<0&&my>=0){html+=`<div class="hand">${hand.map(c=>sam?samCard(c,selected.has(c)):unoCard(c,false)).join('')}</div><div class="row">${sam?`<button data-action="play-sam" ${g.myTurn&&selected.size?'':'disabled'}>Đánh bài đã chọn</button><button data-action="pass" ${g.myTurn&&g.last.length?'':'disabled'}>Bỏ lượt</button><button data-action="call-sam" ${g.myTurn&&!g.last.length&&g.samCalled<0?'':'disabled'}>Báo Sâm</button>`:`<button data-action="draw" ${g.myTurn?'':'disabled'}>Bốc 1 lá</button>`}</div>`;}
if(!sam&&g.winner<0&&wildCard){html+=`<div class="row">Chọn màu: ${['R','G','B','Y'].map(c=>`<button data-color="${c}">${c}</button>`).join('')}</div>`;}html+=`<div class="row">${g.winner>=0?'<button data-action="again">▶ Chơi ván tiếp theo</button>':''}<button data-action="lobby">Về sảnh</button><button data-action="sound" class="${soundEnabled?'sound-on':''}">${soundEnabled?'🔊 Âm thanh bật':'🔇 Âm thanh tắt'}</button></div></div>`;html+=chatPanel();a.innerHTML=html;const newHand=a.querySelector('.hand');if(newHand)newHand.scrollLeft=previousHandScroll;}
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-card],[data-uno],[data-color],[data-emote]');if(!b)return;const d=b.dataset;try{error='';if(d.action==='chat-send'){const field=$('#chat-message');await api('chat',{message:field?.value||''});}else if(d.emote){await api('emote',{emote:d.emote});}else if(d.action==='sound'){soundEnabled=!soundEnabled;localStorage.setItem('samuno:sound',soundEnabled?'on':'off');playTone(620);render();return;}if(d.action==='join'){room=$('#room').value.trim()||'chung';const name=$('#name').value.trim()||'Người chơi';const saved=JSON.parse(localStorage.getItem('samuno:'+room)||'null');const j=await (async()=>{const r=await fetch('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,name,token:saved?.token})});const x=await r.json();if(!r.ok)throw Error(x.error);return x;})();token=j.token;localStorage.setItem('samuno:'+room,JSON.stringify({token}));state=j.state;connect();render();return;}if(d.action==='bot')await api('bot');else if(d.action==='start-sam')await api('start',{game:'sam'});else if(d.action==='start-uno')await api('start',{game:'uno'});else if(d.action==='lobby')await api('lobby');else if(d.action==='again')await api('start',{game:state.game.type});else if(d.action==='draw')await api('action',{command:{type:'draw'}});else if(d.action==='pass')await api('action',{command:{type:'pass'}});else if(d.action==='call-sam')await api('action',{command:{type:'call_sam'}});else if(d.action==='play-sam'){await api('action',{command:{type:'play',cards:[...selected]}});selected.clear();}else if(d.card){playTone(430,.06);const c=+d.card;selected.has(c)?selected.delete(c):selected.add(c);}else if(d.uno){const k=d.uno;if(k[0]==='W'){wildCard=k;}else await api('action',{command:{type:'play',card:k}});}else if(d.color&&wildCard){await api('action',{command:{type:'play',card:wildCard,color:d.color}});wildCard=null;}if(d.action==='again'||d.action==='play-sam'||d.action==='draw'||d.action==='pass'||d.action==='call-sam'||d.action==='start-sam'||d.action==='start-uno')playTone(570,.08);render();}catch(err){error=({game_in_progress:'Ván hiện tại vẫn đang diễn ra. Hãy chờ có người chiến thắng.',cannot_finish_with_two:'Không được kết thúc ván bằng lá 2.',cannot_leave_two_alone:'Không thể đánh nước này vì sẽ chỉ còn lại một lá 2.'})[err.message]||err.message;render();}});
render();
</script></body></html>
