}

function localCombo(cards){if(!cards||!cards.length)return null;const ranks=cards.map(x=>x>>2).sort((a,b)=>a-b);if(ranks.every(x=>x===ranks[0]))return {kind:'set',size:ranks.length,high:ranks[0]};if(ranks.length>=3&&ranks.at(-1)<15&&ranks.every((x,i)=>i===0||x===ranks[i-1]+1))return {kind:'run',size:ranks.length,high:ranks.at(-1)};return null;}
function samHint(hand,lastCards){const sorted=[...hand];const last=localCombo(lastCards);let best=null;function beatsLocal(a,b){if(!b)return true;if(a.kind==='set'&&a.size===4&&b.kind==='set'&&b.size===1&&b.high===15)return true;return a.kind===b.kind&&a.size===b.size&&a.high>b.high;}function visit(start,pick){if(pick.length){const remain=hand.filter(x=>!pick.includes(x));const valid=!(remain.length===0&&pick.some(x=>(x>>2)===15))&&!(remain.length===1&&(remain[0]>>2)===15);const cm=valid?localCombo(pick):null;if(cm&&beatsLocal(cm,last)&&(!best||pick.length<best.length))best=[...pick];}for(let j=start;j<sorted.length;j++){pick.push(sorted[j]);visit(j+1,pick);pick.pop();}}visit(0,[]);return best;}
function historyPanel(g){return '<div class="panel history-panel"><b>📜 Lịch sử ván đấu</b><div class="history-list">'+(g.history||[]).slice().reverse().map(x=>'<div class="history-item">'+esc(x.text)+'</div>').join('')+'</div></div>';}
function profilePanel(players){return '<div class="panel"><b>👤 Hồ sơ người chơi</b><div class="profile-grid">'+players.map(p=>'<div class="profile"><b>🎴 '+esc(p.name)+'</b><div class="muted">'+(p.bot?'Bot':'Người chơi')+' · '+(p.wins||0)+' thắng · '+(p.score||0)+' điểm</div><div class="muted">'+(p.games||0)+' ván · Chuỗi '+(p.streak||0)+' · Kỷ lục '+(p.bestStreak||0)+'</div></div>').join('')+'</div></div>';}
function nextSeatIndex(g){if(!g||!g.names?.length)return -1;const n=g.names.length;const last=g.history?.at(-1);if(g.type==='uno'&&n===2&&last?.type==='play'&&['V','S'].includes(g.top?.[1]))return g.turn;return (g.turn+(g.direction||1)+n)%n;}
function updateClock(){if(connectionLostAt!==null){const left=Math.max(0,120-Math.floor((Date.now()-connectionLostAt)/1000));const banner=$('#connection-status');if(banner){banner.style.display='block';banner.textContent=left>0?'📡 Mất kết nối · Đang tự kết nối lại… còn '+left+' giây':'⌛ Đã hết 120 giây khôi phục kết nối. Hãy tải lại trang để thử vào phòng lại.';}if(left===0&&source){source.close();source=null;}}const el=$('#turn-clock');if(!el||!state?.game)return;const left=Math.max(0,Math.ceil(((state.game.turnDeadline||Date.now()+25000)-Date.now())/1000));el.textContent=left+' giây';el.classList.toggle('timer-danger',left<=5);}

function render(){const a=$('#app');const previousHand=a.querySelector('.hand');const previousHandScroll=previousHand?previousHand.scrollLeft:0;if(!token){a.innerHTML=`<div class="panel"><div class="row"><input id="name" maxlength="24" placeholder="Tên người chơi"><input id="room" maxlength="20" placeholder="Mã phòng mời"></div><div class="row"><button data-action="create-room">＋ Tạo phòng riêng</button><button data-action="join">Vào phòng bằng mã</button></div><div class="muted">Tạo phòng riêng để nhận mã mời, hoặc nhập mã bạn bè gửi để tham gia.</div>${error?`<p class="status">${esc(error)}</p>`:''}</div>`;return;}if(!state){a.innerHTML='<div class="panel"><b>Đang kết nối phòng…</b>'+(error?'<p class="status">'+esc(error)+'</p>':'<p class="muted">Đang chờ máy chủ gửi trạng thái phòng.</p>')+'<div class="row"><button data-action="reconnect">↻ Kết nối lại</button><button data-action="home">Về màn hình đầu</button></div></div>';return;}const players=state.players||[],g=state.game;if(!g){const ranked=(mode)=>[...players].filter(p=>!p.bot).sort((x,y)=>(y.stats?.[mode]?.wins||0)-(x.stats?.[mode]?.wins||0)||(y.stats?.[mode]?.points||0)-(x.stats?.[mode]?.points||0)).slice(0,3);const rankHtml=mode=>ranked(mode).map((p,i)=>`<span class="rank-chip">${['🥇','🥈','🥉'][i]} ${esc(p.name)} · ${p.stats?.[mode]?.wins||0} thắng</span>`).join('')||'Chưa có thành tích';const globalHtml=globalRank?`<div class="muted">🏅 TOP TOÀN HỆ THỐNG · ${globalRankMode==='sam'?'SÂM':'UNO'}</div><div class="leaderboard">${globalRank.map((p,i)=>`<span class="rank-chip">${i+1}. ${esc(p.name)} · ${p.wins} thắng</span>`).join('')||'Chưa có dữ liệu'}</div>`:'';a.innerHTML=`<div class="panel"><div class="big">Sảnh phòng · ${esc(room)}</div><div class="muted">${state.isPrivate?'🔒 PHÒNG RIÊNG':'🌐 PHÒNG THƯỜNG'} · ${state.isHost?'Bạn là chủ phòng':'Đang chờ chủ phòng'}</div><div class="row"><b>Mã mời: <span class="status">${esc(room)}</span></b><button data-action="copy-room">📋 Sao chép mã mời</button></div><div class="muted">Gửi mã này cho bạn bè để họ tham gia đúng phòng.</div><div class="muted">🏆 BẢNG XẾP HẠNG SÂM</div><div class="leaderboard">${rankHtml('sam')}</div><div class="muted">🏆 BẢNG XẾP HẠNG UNO</div><div class="leaderboard">${rankHtml('uno')}</div>${state.persistentProfiles?`<div class="row"><button data-action="global-sam">🏆 Xếp hạng Sâm toàn hệ thống</button><button data-action="global-uno">🏆 Xếp hạng UNO toàn hệ thống</button></div>${globalHtml}`:'<div class="muted">Beta: hồ sơ, xu và vật phẩm đang lưu cục bộ trên trình duyệt. Chưa cần PostgreSQL hoặc tài khoản.</div>'}<div class="row">${players.map(p=>`<span class="seat">${esc(p.name)} · ${p.bot?'🤖 Bot':'👤 Người chơi'} ${p.connected?'':'(mất kết nối)'}</span>`).join('')}</div>${state.isHost?`<div class="row"><button data-action="bot">＋ Thêm Bot</button><button data-action="start-sam">Chơi Sâm</button><button data-action="start-uno">Chơi UNO</button></div>`:'<div class="muted">Chỉ chủ phòng mới có thể thêm Bot hoặc bắt đầu ván.</div>'}${error?`<p class="status">${esc(error)}</p>`:''}</div>`;
a.innerHTML+=`${profilePanel(players)}${chatPanel()}`;a.innerHTML+=walletPanel();return;}
const my=g.mySeat,hand=g.hand||[],sam=g.type==='sam',nextSeat=nextSeatIndex(g);
 const sortedHand=[...hand].sort((a,b)=>sortMode==='suit'?((a&3)-(b&3)||((a>>2)-(b>>2))):((a>>2)-(b>>2)||((a&3)-(b&3))));

 let html=`<section class="game-screen">
 <header class="game-topbar"><div class="game-brand"><span class="mode-chip ${sam?'sam-mode':'uno-mode'}">${sam?'SÂM':'UNO'}</span><span class="game-room-label">Phòng ${esc(room)}</span></div><div class="game-turn-label">${g.winner>=0?'VÁN ĐẤU KẾT THÚC':g.turnLocked?'ĐANG XỬ LÝ LƯỢT':g.myTurn?'ĐẾN LƯỢT BẠN':'Lượt: '+esc(g.names[g.turn]||'—')}</div><div class="game-top-actions"><span class="timer" id="turn-clock">-- giây</span><button class="icon-button" data-action="sound" title="Bật/tắt âm thanh">${soundEnabled?'🔊':'🔇'}</button><button class="icon-button" data-action="lobby" title="Về sảnh" ${state.isHost?'':'disabled'}>⌂</button></div></header>

 ${g.winner<0&&my>=0?`<div class="hand-zone"><div class="hand">${sortedHand.map(c=>sam?samCard(c,selected.has(c)):unoCard(c,selectedUno.includes(c))).join('')}</div></div>`:''}

 ${g.winner>=0&&g.matchWinner<0&&state.isHost?'<button data-action="again">▶ Ván mới</button>':''}${error?`<p class="status game-error">${esc(error)}</p>`:''}
 </div>

$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-card],[data-uno],[data-color],[data-emote],[data-sound],[data-shop-item]');if(!b)return;const d=b.dataset;try{error='';if(d.action==='reconnect'){connectionLostAt=null;connect();return;}else if(d.action==='home'){source?.close();source=null;connectionLostAt=null;room='';token='';state=null;error='';render();return;}else if(d.action==='shop-toggle'){shopOpen=!shopOpen;render();return;}else if(d.action==='effects'){reducedEffects=!reducedEffects;localStorage.setItem('samuno:reduced-effects',reducedEffects?'on':'off');document.body.dataset.effects=reducedEffects?'reduced':'full';render();return;}else if(d.shopItem){const item=SHOP_ITEMS.find(x=>x.id===d.shopItem);if(!item)throw Error('Vật phẩm không tồn tại.');shopEquipped[item.type]=item.id;saveShop();render();return;}else if(d.action==='sort'){sortMode=sortMode==='rank'?'suit':'rank';}else if(d.action==='hint'){if(state?.game?.type==='sam'){const suggestion=samHint(state.game.hand||[],state.game.last||[]);if(suggestion)selected=new Set(suggestion);else error='Không tìm thấy nước đánh hợp lệ.';}else{const g=state.game,hand=g.hand||[];const card=hand.find(k=>k[0]==='W'||k[0]===g.color||k[1]===g.top[1]);if(card)hintedCard=card;else error='Không có lá UNO nào có thể đánh. Hãy bốc bài.';}}else if(d.action==='chat-send'){const field=$('#chat-message');await api('chat',{message:field?.value||''});}else if(d.emote){await api('emote',{emote:d.emote});}else if(d.action==='sound'){soundEnabled=!soundEnabled;localStorage.setItem('samuno:sound',soundEnabled?'on':'off');if(soundEnabled)playTone(620,.1,'effect');render();return;}if(d.sound){soundPrefs[d.sound]=!soundPrefs[d.sound];localStorage.setItem('samuno:s-'+d.sound,soundPrefs[d.sound]?'on':'off');if(soundPrefs[d.sound])playTone(620,.1,'effect');render();return;}if(d.action==='global-sam'||d.action==='global-uno'){globalRankMode=d.action==='global-uno'?'uno':'sam';const response=await fetch('/api/leaderboard/global?mode='+globalRankMode);const result=await response.json();if(!response.ok)throw Error(result.error||'database_unavailable');globalRank=result.rows||[];render();return;}if(d.action==='create-room'){const name=$('#name').value.trim()||'Người chơi';const made=await fetch('/api/room/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});const created=await made.json();if(!made.ok)throw Error(created.error||'create_room_failed');room=created.room;const joined=await fetch('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,name,profileToken:getProfileToken()})});const j=await joined.json();if(!joined.ok)throw Error(j.error||'join_failed');token=j.token;localStorage.setItem('samuno:'+room,JSON.stringify({token}));state=j.state;connect();render();return;}if(d.action==='copy-room'){await navigator.clipboard.writeText(room);error='Đã sao chép mã phòng '+room;render();return;}if(d.action==='join'){room=$('#room').value.trim()||'chung';const name=$('#name').value.trim()||'Người chơi';const saved=JSON.parse(localStorage.getItem('samuno:'+room)||'null');const j=await (async()=>{const r=await fetch('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room,name,token:saved?.token,profileToken:getProfileToken()})});const x=await r.json();if(!r.ok)throw Error(x.error);return x;})();token=j.token;localStorage.setItem('samuno:'+room,JSON.stringify({token}));state=j.state;connect();render();return;}if(d.action==='bot')await api('bot');else if(d.action==='start-sam')await api('start',{game:'sam'});else if(d.action==='start-uno')await api('start',{game:'uno'});else if(d.action==='lobby')await api('lobby');else if(d.action==='again')await api('start',{game:state.game.type});else if(d.action==='draw')await api('action',{command:{type:'draw'}});else if(d.action==='pass')await api('action',{command:{type:'pass'}});else if(d.action==='call-sam')await api('action',{command:{type:'call_sam'}});else if(d.action==='uno')await api('action',{command:{type:'uno'}});else if(d.action==='catch-uno')await api('action',{command:{type:'catch_uno'}});else if(d.action==='accept-penalty')await api('action',{command:{type:'accept_penalty'}});else if(d.action==='pass-drawn')await api('action',{command:{type:'pass_drawn'}});else if(d.action==='play-sam'){await api('action',{command:{type:'play',cards:[...selected]}});selected.clear();}else if(d.card){playCardSound();hintedCard=null;const c=+d.card;selected.has(c)?selected.delete(c):selected.add(c);}else if(d.uno){playCardSound();const k=d.uno;hintedCard=null;const total=(state.game.hand||[]).filter(x=>x===k).length,chosen=selectedUno.filter(x=>x===k).length;if(chosen<total)selectedUno.push(k);else selectedUno=selectedUno.filter(x=>x!==k);wildCard=selectedUno.length&&selectedUno[0][0]==='W'?selectedUno[0]:null;}else if(d.action==='play-uno'){if(selectedUno.some(x=>x[0]==='W')){if(selectedUno.length===1)wildCard=selectedUno[0];else error='Lá đặc biệt không thể ghép đôi trong lượt này.';}else{playCardSound();await api('action',{command:{type:'play',cards:[...selectedUno]}});selectedUno=[];wildCard=null;}}else if(d.color&&wildCard){playCardSound();await api('action',{command:{type:'play',cards:[...selectedUno],color:d.color}});selectedUno=[];wildCard=null;}if(d.action==='again'||d.action==='play-sam'||d.action==='draw'||d.action==='pass'||d.action==='call-sam'||d.action==='start-sam'||d.action==='start-uno')playTone(570,.08,'effect');render();}catch(err){error=({game_in_progress:'Ván hiện tại vẫn đang diễn ra. Hãy chờ có người chiến thắng.',host_only:'Chỉ chủ phòng mới có thể thực hiện thao tác này.',cannot_finish_with_two:'Không được kết thúc ván bằng lá 2.',cannot_leave_two_alone:'Không thể đánh nước này vì sẽ chỉ còn lại một lá 2.'})[err.message]||err.message;render();}});
