<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08121f">
<title>Lời mời tham gia phòng · Gamevui.net</title>
<style>
:root{color-scheme:dark;--bg:#08121f;--panel:#13243a;--line:#ffffff22;--text:#f4f7ff;--muted:#aab8ce;--cyan:#64d8ee}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 15% 0,#1b4260 0,transparent 45%),radial-gradient(ellipse at 90% 10%,#34245e 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
.card{width:min(480px,100%);padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#142940,#101c30);box-shadow:0 22px 70px #0007}
.brand{font-weight:950;letter-spacing:.4px;color:var(--cyan);font-size:13px}.icon{font-size:42px;margin:18px 0 4px}h1{font-size:27px;line-height:1.15;margin:8px 0}p{color:var(--muted);margin:8px 0 18px}.meta{padding:13px;border-radius:13px;background:#ffffff0a;border:1px solid var(--line);margin:16px 0}.meta strong{display:block;font-size:16px}.meta small{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#091626;color:white;font:inherit;outline:none}button{width:100%;padding:12px 14px;border:1px solid #ffffff22;border-radius:12px;background:linear-gradient(135deg,#267b9a,#3156a0);color:white;font:inherit;font-weight:850;cursor:pointer;margin-top:10px}button.secondary{background:#ffffff0c}button:disabled{opacity:.5;cursor:wait}.status{min-height:22px;margin-top:13px;color:#ffd477;font-size:13px}.hidden{display:none!important}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">GAMEVUI.NET · LỜI MỜI CHƠI</div>
  <div class="icon" id="game-icon">🎮</div>
  <h1 id="title">Bạn được mời tham gia phòng!</h1>
  <p id="description">Đang kiểm tra lời mời…</p>
  <div class="meta" id="room-meta"><strong id="game-name">Đang tải trò chơi</strong><small id="room-count">Đang kiểm tra số người trong phòng</small></div>
  <section id="account-options" class="hidden">
    <div id="signed-status" class="small"></div>
    <button id="join-account" class="hidden">Vào phòng bằng tài khoản đang đăng nhập</button>
    <label for="email">Email tài khoản</label><input id="email" type="email" autocomplete="username" placeholder="Email">
    <label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu">
    <button id="login">Đăng nhập và vào phòng</button>
    <button id="guest" class="secondary">Tiếp tục với tư cách khách</button>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="small">Link mời có thời hạn 24 giờ và chỉ hoạt động khi phòng còn chỗ.</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const inviteToken=location.pathname.split('/').filter(Boolean).pop()||'';
const gameInfo={
 sam:['🃏','Sâm'],uno:['🎴','UNO'],caro:['⭕','Cờ caro'],chess:['♟️','Cờ vua'],
 monopoly:['🏙️','Cờ tỷ phú'],sudoku:['🔢','Sudoku'],word:['🔤','Đoán từ'],sequence:['💡','Bấm ô theo thứ tự']
};
let invite=null,sessionUser=null,busy=false;
function profileToken(asGuest=false){const key=asGuest?'samuno:invite-guest-profile-token':'samuno:profile-token';let value=localStorage.getItem(key);if(!value){const b=new Uint8Array(32);crypto.getRandomValues(b);value=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(key,value);}return value;}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'request_failed');return data;}
function message(code){return ({invite_invalid:'Đường link mời không hợp lệ hoặc đã hết hạn.',room_not_found:'Phòng này không còn tồn tại.',room_full:'Phòng đã đủ người.',game_in_progress:'Trò chơi này đã bắt đầu và không nhận thêm người.',invalid_credentials:'Email hoặc mật khẩu chưa đúng.',too_many_attempts:'Bạn đã thử quá nhiều lần. Hãy đợi 15 phút.',persistence_unavailable:'Đăng nhập hiện không khả dụng. Bạn vẫn có thể tiếp tục với tư cách khách.',wrong_game:'Lời mời không khớp với trò chơi.',reconnect_expired:'Thời gian kết nối lại đã hết.'})[code]||code;}
async function joinRoom(asGuest){
 if(busy||!invite)return;busy=true;$('login').disabled=true;$('guest').disabled=true;$('join-account').disabled=true;$('status').textContent='Đang đưa bạn vào phòng…';
 try{
  if(asGuest&&sessionUser)await api('/api/auth/logout',{method:'POST',body:'{}'});
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('samuno:'+invite.room)||'{}')}catch{return {}}})();
  const joined=await api('/api/join',{method:'POST',body:JSON.stringify({room:invite.room,game:invite.gameType,inviteToken,token:saved.token||'',name:sessionUser?.nickname||'Người chơi',profileToken:profileToken(asGuest),asGuest})});
  localStorage.setItem('samuno:'+invite.room,JSON.stringify({token:joined.token}));
  const game=invite.gameType,room=encodeURIComponent(invite.room);
  const target=game==='caro'?'/games/caro?online=1&room='+room+'&mode='+encodeURIComponent(invite.caroMode||'normal'):
    game==='chess'?'/games/chess?online=1&room='+room:
    game==='monopoly'?'/games/monopoly?online=1&room='+room:
    ['sudoku','word','sequence'].includes(game)?'/games/'+game+'?online=1&room='+room:
    '/play?room='+room+'&game='+encodeURIComponent(game);
  location.replace(target);
 }catch(error){$('status').textContent=message(error.message);busy=false;$('login').disabled=false;$('guest').disabled=false;$('join-account').disabled=false;}
}
async function init(){
 try{
  if(!/^[A-Za-z0-9_-]{40,50}$/.test(inviteToken))throw new Error('invite_invalid');
  invite=await api('/api/invite/'+encodeURIComponent(inviteToken),{method:'GET',headers:{}});
  const [icon,name]=gameInfo[invite.gameType]||['🎮','Trò chơi trực tuyến'];
  $('game-icon').textContent=icon;$('game-name').textContent=name;$('title').textContent='Bạn được mời chơi '+name+'!';
  $('description').textContent='Chọn đăng nhập hoặc tiếp tục với tư cách khách. Sau đó bạn sẽ tự động vào đúng phòng.';
  $('room-count').textContent=invite.playerCount+'/'+invite.maxPlayers+' người đang ở trong phòng';
  let auth={user:null};try{auth=await api('/api/auth/me',{method:'GET',headers:{}});}catch{}
  sessionUser=auth.user||null;
  $('signed-status').textContent=sessionUser?'Đã đăng nhập: '+(sessionUser.nickname||sessionUser.email):'Bạn chưa đăng nhập tài khoản.';
  $('join-account').classList.toggle('hidden',!sessionUser);
  $('account-options').classList.remove('hidden');
 }catch(error){$('title').textContent='Không thể sử dụng lời mời';$('description').textContent=message(error.message);$('room-meta').classList.add('hidden');$('status').textContent='Bạn có thể quay lại Game Hub để chọn một phòng khác.';}
}
$('login').addEventListener('click',async()=>{
 if(busy)return;
 try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw new Error('Vui lòng nhập email và mật khẩu.');await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});sessionUser={email};await joinRoom(false);}
 catch(error){$('status').textContent=message(error.message);}
});
$('join-account').addEventListener('click',()=>joinRoom(false));
$('guest').addEventListener('click',()=>joinRoom(true));
init();
</script>
</body>
</html>
